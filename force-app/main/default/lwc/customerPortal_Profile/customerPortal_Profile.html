<template>
    <!-- Figma p88 view (grey read-only fields, Edit Profile), p89 edit (white fields, + on the photo, Save Profile),
         p90 view with a photo. Data: CustomerPortalProfileController (getProfile / updateProfile /
         uploadProfilePicture / changePassword). -->
    <div class="cp-page profile-page">
        <template lwc:if={isLoading}>
            <div class="cp-loading">
                <lightning-spinner alternative-text={text.loading} size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={loadError}>
            <div class="cp-alert cp-alert_error profile-load-error" role="alert" data-id="load-error">
                <span>{loadError}</span>
                <button type="button" class="cp-btn cp-btn_link profile-retry" data-id="retry" onclick={handleRetry}>{text.retry}</button>
            </div>
        </template>

        <template lwc:elseif={showProfile}>
            <div class="cp-page-head">
                <div class="cp-page-head__text">
                    <h1 class="cp-page-title cp-page-title_brand">{text.title}</h1>
                    <p class="cp-page-intro">{text.intro}</p>
                </div>
            </div>

            <template lwc:if={formError}>
                <div class="cp-alert cp-alert_error profile-message" role="alert" data-id="form-error">{formError}</div>
            </template>
            <template lwc:if={successMessage}>
                <div class="cp-alert cp-alert_success profile-message" role="status" data-id="success">{successMessage}</div>
            </template>

            <div class="profile-layout">
                <div class="profile-side">
                    <div class="profile-photo">
                        <img class="profile-photo__img" src={avatarSrc} alt={text.photoAlt} data-id="avatar" onerror={handleAvatarError} />
                        <template lwc:if={isPreparingPhoto}>
                            <span class="profile-photo__busy" role="status">
                                <span class="profile-spinner profile-spinner_dark" aria-hidden="true"></span>
                                <span class="cp-visually-hidden">{text.preparingPhoto}</span>
                            </span>
                        </template>
                        <template lwc:if={isEditing}>
                            <button
                                type="button"
                                class="profile-photo__add"
                                title={text.addPhoto}
                                aria-label={text.addPhoto}
                                data-id="add-photo"
                                disabled={isSaving}
                                onclick={handleAddPhotoClick}
                            >
                                <svg viewBox="0 0 16 16" aria-hidden="true">
                                    <rect x="6.9" y="0.5" width="2.2" height="15" rx="1.1"></rect>
                                    <rect x="0.5" y="6.9" width="15" height="2.2" rx="1.1"></rect>
                                </svg>
                            </button>
                            <input
                                type="file"
                                accept="image/jpeg,image/png"
                                class="profile-photo__input"
                                tabindex="-1"
                                aria-hidden="true"
                                data-id="photo-input"
                                onchange={handlePhotoSelected}
                            />
                        </template>
                    </div>

                    <p class="profile-name" data-id="full-name">{profile.fullName}</p>

                    <template lwc:if={isEditing}>
                        <button
                            type="button"
                            class={saveButtonClass}
                            data-id="save"
                            disabled={isBusy}
                            aria-busy={savingState}
                            onclick={handleSaveProfile}
                        >
                            <template lwc:if={isSaving}>
                                <span class="profile-spinner" aria-hidden="true"></span>
                            </template>
                            <span>{text.save}</span>
                        </button>
                        <button
                            type="button"
                            class="cp-btn cp-btn_link profile-cancel"
                            data-id="cancel"
                            disabled={isSaving}
                            onclick={handleCancelEdit}
                        >{text.cancel}</button>
                    </template>
                    <template lwc:else>
                        <button type="button" class="cp-btn profile-action" data-id="edit" onclick={handleEditProfile}>{text.edit}</button>
                    </template>
                    <span class="cp-visually-hidden" role="status">{savingStatus}</span>

                    <template lwc:if={photoError}>
                        <p class="cp-error profile-photo-note" role="alert" data-id="photo-error">{photoError}</p>
                    </template>
                    <template lwc:elseif={photoHint}>
                        <p class="cp-help profile-photo-note" data-id="photo-hint">{photoHint}</p>
                    </template>
                </div>

                <div class="profile-details">
                    <h2 class="cp-section-title profile-section">{text.personal}</h2>
                    <div class="cp-form-grid">
                        <div class="cp-field">
                            <label class="cp-label" for="firstName">{text.firstName}</label>
                            <input
                                id="firstName"
                                type="text"
                                class={ui.firstNameClass}
                                value={form.firstName}
                                readonly={isViewing}
                                maxlength="40"
                                autocomplete="given-name"
                                aria-invalid={ui.firstNameInvalid}
                                aria-describedby="firstName-error"
                                data-id="first-name"
                                data-field="firstName"
                                oninput={handleFieldInput}
                            />
                            <template lwc:if={fieldErrors.firstName}>
                                <p id="firstName-error" class="cp-error" data-id="first-name-error">{fieldErrors.firstName}</p>
                            </template>
                        </div>
                        <div class="cp-field">
                            <label class="cp-label" for="lastName">{text.lastName}</label>
                            <input
                                id="lastName"
                                type="text"
                                class={ui.lastNameClass}
                                value={form.lastName}
                                readonly={isViewing}
                                maxlength="80"
                                autocomplete="family-name"
                                aria-invalid={ui.lastNameInvalid}
                                aria-describedby="lastName-error"
                                data-id="last-name"
                                data-field="lastName"
                                oninput={handleFieldInput}
                            />
                            <template lwc:if={fieldErrors.lastName}>
                                <p id="lastName-error" class="cp-error" data-id="last-name-error">{fieldErrors.lastName}</p>
                            </template>
                        </div>
                        <div class="cp-field">
                            <label class="cp-label" for="email">{text.email}</label>
                            <input
                                id="email"
                                type="email"
                                class={ui.emailClass}
                                value={form.email}
                                readonly={isViewing}
                                maxlength="80"
                                autocomplete="email"
                                spellcheck="false"
                                aria-invalid={ui.emailInvalid}
                                aria-describedby="email-error email-note"
                                data-id="email"
                                data-field="email"
                                oninput={handleFieldInput}
                            />
                            <template lwc:if={fieldErrors.email}>
                                <p id="email-error" class="cp-error" data-id="email-error">{fieldErrors.email}</p>
                            </template>
                            <template lwc:if={showEmailNote}>
                                <p id="email-note" class="cp-help" data-id="email-note">{text.emailPendingNote}</p>
                            </template>
                        </div>
                        <div class="cp-field">
                            <label class="cp-label" for="phoneNumber">{text.phone}</label>

                                            <path d="M8.6 1.4L10.1 1.4L10.1 15.8L8.6 15.8L8.6 1.4Z" fill="#e8aa00"></path>

                                        </svg>
                                    </template>
                                    <template lwc:elseif={isFlagIN}>
                                        <svg class="profile-phone__flag" viewBox="0 0 22 16" aria-hidden="true" data-id="flag-in">
                                            <rect width="22" height="16" fill="#ffffff"></rect>
                                            <rect width="22" height="5.33" fill="#ff9933"></rect>
                                            <rect y="10.67" width="22" height="5.33" fill="#138808"></rect>

                                    <template lwc:elseif={isFlagUS}>

                                        </svg>
                                    </template>
                                    <span id="phone-code" class="profile-phone__code" data-id="phone-code">{phoneCode}</span>
                                    <template lwc:if={isEditing}>
                                        <span class="profile-phone__chevron" aria-hidden="true"></span>
                                        <select
                                            class="profile-phone__select"
                                            aria-label={text.countryCode}
                                            data-id="phone-country"
                                            onchange={handleCountryChange}
                                        >
                                            <template for:each={countryOptions} for:item="country">
                                                <option key={country.code} value={country.code} selected={country.selected}>{country.label}</option>

                                    autocomplete="tel-national"
                                    aria-invalid={ui.phoneInvalid}
                                    aria-describedby="phone-code phone-error"
                                    data-id="phone-number"
                                    data-field="phoneNumber"
                                    oninput={handleFieldInput}

                                data-id="department"

                    <h2 class="cp-section-title profile-section profile-section_next">{text.account}</h2>
                    <div class="cp-form-grid">

                            <label class="cp-label" for="username">{text.username}</label>
                            <input id="username" type="text" class="cp-input" value={profile.username} readonly data-id="username" />
                        </div>
                        <div class="cp-field">
                            <label class="cp-label" for="password">{text.password}</label>
                            <div class="cp-input-group">
                                <input id="password" type="text" class="cp-input profile-password" value={text.passwordMask} readonly data-id="password" />
                                <button
                                    type="button"
                                    class="cp-btn cp-btn_link profile-change"
                                    aria-label={text.changePassword}
                                    aria-haspopup="dialog"
                                    data-id="change-password"
                                    onclick={handleOpenPassword}
                                >{text.change}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Change password popup (portal modal style) -->
        <template lwc:if={isPasswordOpen}>
            <div class="cp-modal-overlay" role="presentation" onkeydown={handlePasswordKeydown}>
                <section
                    class="cp-modal cp-modal_md profile-pw"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="pw-title"
                    data-id="password-modal"
                >
                    <button
                        type="button"
                        class="cp-close cp-modal__close"
                        title={text.close}
                        aria-label={text.close}
                        disabled={isChangingPassword}
                        data-id="pw-close"
                        data-pw-focus
                        onclick={handleClosePassword}
                    >
                        <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d={closePath}></path></svg>
                    </button>

                    <template lwc:if={passwordChanged}>
                        <svg class="profile-pw__check" viewBox="0 0 72 72" aria-hidden="true">
                            <circle cx="36" cy="36" r="36"></circle>
                            <path d="M22 37l9 9 19-19"></path>
                        </svg>
                    </template>
                    <h2 id="pw-title" class="cp-modal__title">{passwordTitle}</h2>

                    <template lwc:if={passwordChanged}>
                        <p class="cp-modal__text" role="status" data-id="pw-success">{text.pwDoneText}</p>
                        <div class="cp-modal__footer">
                            <button type="button" class="cp-btn cp-btn_lg" data-id="pw-done" data-pw-focus onclick={handleClosePassword}>{text.pwDone}</button>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="cp-modal__text">{text.pwText}</p>
                        <form class="cp-modal__body profile-pw__form" novalidate aria-busy={pwBusyState} onsubmit={handleSubmitPassword}>
                            <template lwc:if={passwordError}>
                                <div class="cp-alert cp-alert_error profile-pw__error" role="alert" data-id="pw-error">{passwordError}</div>
                            </template>

                            <div class="cp-field">
                                <label class="cp-label" for="pwCurrent">{text.pwCurrent}</label>
                                <div class="profile-pw__control">
                                    <input
                                        id="pwCurrent"
                                        type={pw.currentType}
                                        class={pw.currentClass}
                                        value={passwords.current}
                                        autocomplete="current-password"
                                        aria-invalid={pw.currentInvalid}
                                        aria-describedby="pwCurrent-error"
                                        data-id="pw-current"
                                        data-field="current"
                                        data-pw-focus
                                        oninput={handlePasswordInput}
                                    />
                                    <button
                                        type="button"
                                        class={pw.currentEyeClass}
                                        aria-label={text.pwShowCurrent}
                                        aria-pressed={pw.currentShown}
                                        aria-controls="pwCurrent"
                                        data-id="pw-eye-current"
                                        data-field="current"
                                        data-pw-focus
                                        onclick={handleTogglePasswordShown}
                                    >
                                        <template lwc:if={pw.currentEyeOff}>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyeOffPath}></path></svg>
                                        </template>
                                        <template lwc:else>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyePath}></path></svg>
                                        </template>
                                    </button>
                                </div>
                                <template lwc:if={passwordErrors.current}>
                                    <p id="pwCurrent-error" class="cp-error" data-id="pw-current-error">{passwordErrors.current}</p>
                                </template>
                            </div>

                            <div class="cp-field">
                                <label class="cp-label" for="pwNew">{text.pwNew}</label>
                                <div class="profile-pw__control">
                                    <input
                                        id="pwNew"
                                        type={pw.nextType}
                                        class={pw.nextClass}
                                        value={passwords.next}
                                        autocomplete="new-password"
                                        aria-invalid={pw.nextInvalid}
                                        aria-describedby="pwNew-rules pwNew-error"
                                        data-id="pw-next"
                                        data-field="next"
                                        data-pw-focus
                                        oninput={handlePasswordInput}
                                    />
                                    <button
                                        type="button"
                                        class={pw.nextEyeClass}
                                        aria-label={text.pwShowNew}
                                        aria-pressed={pw.nextShown}
                                        aria-controls="pwNew"
                                        data-id="pw-eye-next"
                                        data-field="next"
                                        data-pw-focus
                                        onclick={handleTogglePasswordShown}
                                    >
                                        <template lwc:if={pw.nextEyeOff}>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyeOffPath}></path></svg>
                                        </template>
                                        <template lwc:else>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyePath}></path></svg>
                                        </template>
                                    </button>
                                </div>
                                <template lwc:if={passwordErrors.next}>
                                    <p id="pwNew-error" class="cp-error" data-id="pw-next-error">{passwordErrors.next}</p>
                                </template>
                                <template lwc:else>
                                    <p id="pwNew-rules" class="cp-help profile-pw__rules" data-id="pw-rules">{text.pwRules}</p>
                                </template>
                            </div>

                            <div class="cp-field">
                                <label class="cp-label" for="pwConfirm">{text.pwConfirm}</label>
                                <div class="profile-pw__control">
                                    <input
                                        id="pwConfirm"
                                        type={pw.confirmType}
                                        class={pw.confirmClass}
                                        value={passwords.confirm}
                                        autocomplete="new-password"
                                        aria-invalid={pw.confirmInvalid}
                                        aria-describedby="pwConfirm-error"
                                        data-id="pw-confirm"
                                        data-field="confirm"
                                        data-pw-focus
                                        oninput={handlePasswordInput}
                                    />
                                    <button
                                        type="button"
                                        class={pw.confirmEyeClass}
                                        aria-label={text.pwShowConfirm}
                                        aria-pressed={pw.confirmShown}
                                        aria-controls="pwConfirm"
                                        data-id="pw-eye-confirm"
                                        data-field="confirm"
                                        data-pw-focus
                                        onclick={handleTogglePasswordShown}
                                    >
                                        <template lwc:if={pw.confirmEyeOff}>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyeOffPath}></path></svg>
                                        </template>
                                        <template lwc:else>
                                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d={eyePath}></path></svg>
                                        </template>
                                    </button>
                                </div>
                                <template lwc:if={passwordErrors.confirm}>
                                    <p id="pwConfirm-error" class="cp-error" data-id="pw-confirm-error">{passwordErrors.confirm}</p>
                                </template>
                            </div>

                            <div class="cp-modal__footer">
                                <button
                                    type="button"
                                    class="cp-btn cp-btn_lg cp-btn_secondary"
                                    disabled={isChangingPassword}
                                    data-id="pw-cancel"
                                    data-pw-focus
                                    onclick={handleClosePassword}
                                >{text.cancel}</button>
                                <button
                                    type="submit"
                                    class={pwSubmitClass}
                                    disabled={isChangingPassword}
                                    aria-busy={pwBusyState}
                                    data-id="pw-submit"
                                    data-pw-focus
                                >
                                    <template lwc:if={isChangingPassword}>
                                        <span class="profile-spinner" aria-hidden="true"></span>
                                    </template>
                                    <span>{text.pwSubmit}</span>
                                </button>
                            </div>
                            <span class="cp-visually-hidden" role="status">{pwStatus}</span>
                        </form>
                    </template>
                </section>
            </div>
        </template>
    </div>
</template>
