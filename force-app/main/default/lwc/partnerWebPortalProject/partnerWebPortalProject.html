<template>
    <template lwc:if={selectedProject}>
        <c-partner-web-portal-project-detail project={selectedProject} onback={handleBackToList}>
        </c-partner-web-portal-project-detail>
    </template>

    <div class="page" lwc:else>

        <!-- HEADER -->
        <header class="page-header">
            <h1 class="page-title">Projects</h1>
            <p class="page-subtitle">
                Explore our exclusive project listings tailored for our channel partners.
                You can access detailed information on each project. Stay informed and
                provide your clients with the best options using the comprehensive
                resources provided by John Keells Properties. Empower your business with
                the latest updates and exclusive insights into our diverse range of
                properties.
            </p>
        </header>

        <!-- ERROR -->
        <template lwc:if={error}>
            <div class="error-msg">{error}</div>
        </template>

        <!-- GRID -->
        <template lwc:if={hasProjects}>
            <div class="card-grid">
                <template for:each={projects} for:item="project">
                    <article key={project.id} class="project-card">

                        <!-- MEDIA -->
                        <div class="carousel">
                            <template lwc:if={project.hasImages}>
                                <template for:each={project.carouselImages} for:item="slide">
                                    <div key={slide.key} class={slide.slideClass}>
                                        <img src={slide.url} alt={project.name} class="carousel-img" />
                                    </div>
                                </template>
                            </template>
                            <template lwc:else>
                                <div class="media-placeholder" aria-hidden="true">
                                    <span class="media-initial">{project.initial}</span>
                                </div>
                            </template>

                            <template lwc:if={project.hasMultipleImages}>
                                <button class="carousel-nav prev"
                                        data-id={project.id}
                                        onclick={handlePrev}
                                        type="button"
                                        title="Previous">‹</button>

                                <button class="carousel-nav next"
                                        data-id={project.id}
                                        onclick={handleNext}
                                        type="button"
                                        title="Next">›</button>

                                <div class="carousel-dots">
                                    <template for:each={project.dots} for:item="dot">
                                        <button key={dot.key}
                                                class={dot.dotClass}
                                                data-id={project.id}
                                                data-index={dot.index}
                                                onclick={handleDotClick}
                                                aria-label="Go to image"
                                                type="button">
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- INFO -->
                        <div class="project-info">
                            <h2 class="project-name" title={project.name}>{project.name}</h2>
                            <p class="project-location" title={project.location}>{project.location}</p>

                            <button class="btn-primary"
                                    data-id={project.id}
                                    onclick={handleViewDetails}
                                    type="button">
                                View Details
                            </button>
                        </div>

                    </article>
                </template>
            </div>
        </template>
        <template lwc:elseif={showEmpty}>
            <div class="empty-state">No projects available right now.</div>
        </template>

    </div>
</template>
