<template>

    <!-- ============================================ -->
    <!-- FORM VIEW: REQUEST A SITE VISIT              -->
    <!-- ============================================ -->
    <template lwc:if={isFormView}>
        <div class="form-page">

            <!-- HEADER -->
            <div class="schedule-header">
                <button class="back-icon-btn" onclick={handleFormCancel} type="button" title="Back" aria-label="Back">
                    <lightning-icon icon-name="utility:back" size="small" class="back-icon"></lightning-icon>
                </button>
                <h2 class="schedule-title">Request Site Visit</h2>
            </div>

            <div class="schedule-visit-card">

                <!-- INLINE ERROR BANNER -->
                <template lwc:if={errorMessage}>
                    <div class="alert-banner error-banner" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" class="alert-icon error-icon"></lightning-icon>
                        <span class="alert-text">{errorMessage}</span>
                        <button class="banner-close-btn" onclick={handleCloseError} type="button" aria-label="Close">✕</button>
                    </div>
                </template>

                <!-- ROW 1: CUSTOMER & PROJECT -->
                <div class="form-grid-2">
                    <div class="form-field">
                        <label for="customerSelect">Customer <abbr class="required-star" title="required">*</abbr></label>
                        <div class="select-wrap">
                            <select id="customerSelect"
                                    class={customerClass}
                                    data-field="leadId"
                                    required
                                    aria-required="true"
                                    aria-invalid={customerInvalid}
                                    aria-describedby="customer-error"
                                    value={form.leadId}
                                    onblur={handleBlur}
                                    onchange={handleCustomerChange}>
                                <option value="">Select lead name</option>
                                <template for:each={customerChoices} for:item="cust">
                                    <option key={cust.value} value={cust.value} selected={cust.selected}>{cust.label}</option>
                                </template>
                            </select>
                        </div>
                        <template lwc:if={customerError}>
                            <span class="field-error" id="customer-error">{customerError}</span>
                        </template>
                        <span class="field-subtext">Your open leads without a pending or scheduled visit.</span>
                    </div>

                    <div class="form-field">
                        <!-- An old lead without a project: the partner chooses one of their projects, as before -->
                        <template lwc:if={chooseProject}>
                            <label for="projectSelect">Project <abbr class="required-star" title="required">*</abbr></label>
                            <div class="select-wrap">
                                <select id="projectSelect"
                                        class={projectClass}
                                        data-field="projectId"
                                        required
                                        aria-required="true"
                                        aria-invalid={projectInvalid}
                                        aria-describedby="project-error project-hint"
                                        value={form.projectId}
                                        onblur={handleBlur}
                                        onchange={handleFormChange}>
                                    <option value="">Select Project</option>
                                    <template for:each={projectChoices} for:item="proj">
                                        <option key={proj.value} value={proj.value} selected={proj.selected}>{proj.label}</option>
                                    </template>
                                </select>
                            </div>
                        </template>
                        <!-- Otherwise the chosen lead's project, read-only: its site visits are for that project only -->
                        <template lwc:else>
                            <label for="projectField">Project <abbr class="required-star" title="required">*</abbr></label>
                            <div class="readonly-wrap">
                                <input id="projectField"
                                       type="text"
                                       class={projectClass}
                                       data-field="projectId"
                                       readonly
                                       aria-readonly="true"
                                       aria-invalid={projectInvalid}
                                       aria-describedby="project-error project-hint"
                                       placeholder={labels.projectPlaceholder}
                                       value={projectName} />
                                <lightning-icon icon-name="utility:lock" size="x-small" class="readonly-icon"></lightning-icon>
                            </div>
                        </template>
                        <template lwc:if={projectError}>
                            <span class="field-error" id="project-error">{projectError}</span>
                        </template>
                        <span class="field-subtext" id="project-hint">{projectHint}</span>
                    </div>
                </div>

                <!-- ROW 2: REQUIREMENT TYPE -->
                <div class="form-grid-2">
                    <div class="form-field">
                        <label for="requirementTypeSelect">Requirement Type <abbr class="required-star" title="required">*</abbr></label>
                        <div class="select-wrap">
                            <select id="requirementTypeSelect"
                                    class={requirementTypeClass}
                                    data-field="requirementType"
                                    required
                                    aria-required="true"
                                    aria-invalid={requirementTypeInvalid}
                                    aria-describedby="requirement-error"
                                    value={form.requirementType}
                                    onblur={handleBlur}
                                    onchange={handleFormChange}>
                                <option value="">Select Requirement Type</option>
                                <template for:each={requirementTypeChoices} for:item="type">
                                    <option key={type.value} value={type.value} selected={type.selected}>{type.label}</option>
                                </template>
                            </select>
                        </div>
                        <template lwc:if={requirementTypeError}>
                            <span class="field-error" id="requirement-error">{requirementTypeError}</span>
                        </template>
                    </div>
                </div>

                <!-- ROW 3: DATE & VISIT TIME -->
                <div class="form-grid-2">
                    <div class="form-field">
                        <label for="visitDate">Date <abbr class="required-star" title="required">*</abbr></label>
                        <input id="visitDate"
                               class={dateClass}
                               type="date"
                               min={todayDate}
                               data-field="visitDate"
                               required
                               aria-required="true"
                               aria-invalid={dateInvalid}
                               aria-describedby="date-error"
                               value={form.visitDate}
                               onblur={handleBlur}
                               onchange={handleFormChange} />
                        <template lwc:if={dateError}>
                            <span class="field-error" id="date-error">{dateError}</span>
                        </template>
                    </div>

                    <div class="form-field">
                        <label id="visitTimeLabel">Visit Time <abbr class="required-star" title="required">*</abbr></label>
                        <div class={timeBoxClass} role="group" aria-labelledby="visitTimeLabel" aria-describedby="time-error">
                            <input type="text"
                                   class="time-num-input"
                                   inputmode="numeric"
                                   maxlength="2"
                                   placeholder="hh"
                                   aria-label="Hours"
                                   aria-required="true"
                                   aria-invalid={timeInvalid}
                                   aria-describedby="time-error"
                                   data-field="visitTime"
                                   data-part="hours"
                                   value={timeHours}
                                   onblur={handleBlur}
                                   oninput={handleHourChange} />
                            <span class="time-colon">:</span>
                            <input type="text"
                                   class="time-num-input"
                                   inputmode="numeric"
                                   maxlength="2"
                                   placeholder="mm"
                                   aria-label="Minutes"
                                   aria-required="true"
                                   aria-invalid={timeInvalid}
                                   aria-describedby="time-error"
                                   data-field="visitTime"
                                   data-part="minutes"
                                   value={timeMinutes}
                                   onblur={handleBlur}
                                   oninput={handleMinuteChange} />

                            <div class="am-pm-toggle">
                                <button type="button"
                                        class={amButtonClass}
                                        onclick={handleSelectAM}>AM</button>
                                <button type="button"
                                        class={pmButtonClass}
                                        onclick={handleSelectPM}>PM</button>
                            </div>
                        </div>
                        <template lwc:if={timeError}>
                            <span class="field-error" id="time-error">{timeError}</span>
                        </template>
                    </div>
                </div>

                <!-- ROW 4: DESCRIPTION -->
                <div class="form-field full-width">
                    <label for="description">Description <abbr class="required-star" title="required">*</abbr></label>
                    <textarea id="description"
                              class={descriptionClass}
                              rows="4"
                              placeholder="Family of 4, 3.5BHK preference, looking for higher floors..."
                              data-field="description"
                              required
                              aria-required="true"
                              aria-invalid={descriptionInvalid}
                              aria-describedby="description-error"
                              value={form.description}
                              onblur={handleBlur}
                              oninput={handleFormChange}
                              onchange={handleFormChange}></textarea>
                    <template lwc:if={descriptionError}>
                        <span class="field-error" id="description-error">{descriptionError}</span>
                    </template>
                </div>

                <!-- NOTIFICATION ALERT BANNER -->
                <div class="notification-alert-box">
                    <lightning-icon icon-name="utility:notification" size="x-small" class="alert-bell-icon"></lightning-icon>
                    <p class="notification-text">
                        <strong>Approval:</strong> {labels.requestNote}
                    </p>
                </div>

                <!-- FOOTER BUTTONS -->
                <div class="schedule-form-footer">
                    <button class="btn-cancel" type="button" onmousedown={keepFocus} onclick={handleFormCancel}>
                        Cancel
                    </button>
                    <button class="btn-confirm"
                            type="button"
                            onmousedown={keepFocus}
                            onclick={handleRegisterVisit}
                            disabled={isConfirmDisabled}>
                        {saveButtonLabel}
                    </button>
                </div>

            </div>
        </div>
    </template>

    <!-- ============================================ -->
    <!-- LIST VIEW                                     -->
    <!-- ============================================ -->
    <template lwc:else>
        <div class="container">

            <!-- HEADER -->
            <div class="page-header">
                <h1 class="page-title">Site Visits</h1>
                <p class="page-description">
                    Manage site visits effortlessly with our comprehensive tracking system.
                    Access detailed information about each visit, including visitor details,
                    visit source, and current status. Stay organized and ensure timely follow-ups
                    to maximize your conversion rates with the support of John Keells Properties.
                </p>
            </div>

            <!-- ACTION + STAT TILES -->
            <div class="tile-row">
                <button class="tile tile-action" onclick={handleNavigation} type="button">
                    <lightning-icon icon-name="utility:add" size="medium" class="tile-add-icon"></lightning-icon>
                    <span class="tile-action-label">Request Site Visit</span>
                </button>
                <div class="tile tile-stat">
                    <span class="tile-stat-value">{totalRecords}</span>
                    <span class="tile-stat-label">No of Site Visits</span>
                </div>
            </div>

            <!-- INLINE ERROR BANNER (e.g. export failure) -->
            <template lwc:if={errorMessage}>
                <div class="alert-banner error-banner list-banner" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" class="alert-icon error-icon"></lightning-icon>
                    <span class="alert-text">{errorMessage}</span>
                    <button class="banner-close-btn" onclick={handleCloseError} type="button" aria-label="Close">✕</button>
                </div>
            </template>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="search-wrapper">
                    <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                    <input type="text"
                           class="search-input"
                           placeholder="Search.."
                           aria-label="Search site visits"
                           oninput={handleSearch} />
                </div>
                <div class="action-buttons">
                    <button class="btn-export" type="button" onclick={handleExport} disabled={noVisits}>
                        <lightning-icon icon-name="utility:upload" size="x-small" class="export-icon"></lightning-icon>
                        <span>Export CSV</span>
                    </button>
                </div>
            </div>

            <!-- FILTER CHIPS -->
            <div class="filter-tabs">
                <template for:each={filterButtons} for:item="tab">
                    <button key={tab.value}
                            type="button"
                            class={tab.className}
                            data-value={tab.value}
                            aria-pressed={tab.pressed}
                            onclick={handleFilterClick}>
                        {tab.label}
                    </button>
                </template>
            </div>

            <!-- TABLE -->
            <div class="table-wrapper">
                <table class="visits-table">
                    <thead>
                        <tr>
                            <th class="col-sr">Sr.</th>
                            <th>Visit Created Date</th>
                            <th>Visit Name</th>
                            <th>Customer (Lead)</th>
                            <th>Channel Partner</th>
                            <th>Project</th>
                            <th>Visit Date</th>
                            <th class="col-status">Visit Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template lwc:if={hasVisits}>
                            <template for:each={visits} for:item="visit">
                                <tr key={visit.Id}>
                                    <td class="col-sr">{visit.rowNo}</td>
                                    <td>{visit.formattedDate}</td>
                                    <td>{visit.Name}</td>
                                    <td>{visit.leadName}</td>
                                    <td>{visit.channelPartner}</td>
                                    <td>{visit.projectName}</td>
                                    <td class="col-date">{visit.visitDate}</td>
                                    <td class="col-status"><span class={visit.badgeClass}>{visit.status}</span></td>
                                </tr>
                            </template>
                        </template>
                        <template lwc:else>
                            <tr>
                                <td colspan="8" class="no-data">No site visits found</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination">
                <div class="entries-text">{entriesText}</div>
                <div class="pagination-controls">
                    <button class="page-arrow" type="button" onclick={handlePrev} disabled={isPrevDisabled}>
                        <lightning-icon icon-name="utility:back" size="x-small" class="arrow-icon"></lightning-icon>
                        <span>Prev</span>
                    </button>
                    <template for:each={paginationButtons} for:item="p">
                        <button key={p.value}
                                type="button"
                                class={p.className}
                                data-value={p.value}
                                onclick={handlePageClick}>
                            {p.label}
                        </button>
                    </template>
                    <button class="page-arrow page-arrow-next" type="button" onclick={handleNext} disabled={isNextDisabled}>
                        <span>Next</span>
                        <lightning-icon icon-name="utility:forward" size="x-small" class="arrow-icon"></lightning-icon>
                    </button>
                </div>
            </div>

        </div>
    </template>

    <!-- ============================================ -->
    <!-- SUCCESS MODAL: SITE VISIT SCHEDULED           -->
    <!-- ============================================ -->
    <template lwc:if={showSuccessModal}>
        <div class="modal-backdrop" onclick={handleCloseSuccess}></div>
        <div class="success-modal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
            <button class="modal-close-btn" type="button" onclick={handleCloseSuccess} aria-label="Close">
                <lightning-icon icon-name="utility:close" size="small" class="close-icon"></lightning-icon>
            </button>

            <!-- Decorative illustration: flag -->
            <svg class="success-illustration" viewBox="0 0 240 240" aria-hidden="true">
                <ellipse cx="120" cy="222" rx="70" ry="8" fill="#ebe9e9"></ellipse>
                <circle cx="120" cy="118" r="86" fill="#f3f8f9"></circle>
                <line x1="92" y1="214" x2="132" y2="34" stroke="#37474f" stroke-width="5" stroke-linecap="round"></line>
                <circle cx="132" cy="32" r="5" fill="#37474f"></circle>
                <path d="M131 38 C 150 30, 168 50, 186 62 C 196 68, 204 76, 214 70 C 204 88, 186 86, 172 80 C 158 74, 142 78, 124 72 Z" fill="#8bc53f"></path>
                <path d="M129 50 C 142 48, 150 58, 160 66 C 150 72, 138 72, 124 72 Z" fill="#6aa12a"></path>
                <circle cx="176" cy="150" r="24" fill="#238723"></circle>
                <path d="M165 150 l8 8 l15 -16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>

            <h3 id="successTitle" class="success-title">{labels.successTitle}</h3>
            <p class="success-text">
                {labels.successText}
            </p>
        </div>
    </template>

</template>
