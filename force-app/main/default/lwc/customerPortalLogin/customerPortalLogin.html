<template>
    <div class="login">
        <div class="login__photo" style={photoStyle} aria-hidden="true"></div>

        <main class="login__panel">
            <div class="login__column">
                <div class="login__logo" style={logoStyle} role="img" aria-label={text.LOGO_LABEL}></div>

                <!-- ================= LOGIN (Figma pages 1-2) ================= -->
                <template lwc:if={isLoginStep}>
                    <form class="login__form" novalidate aria-busy={busyState} onsubmit={handleLogin}>
                        <div class="cp-field login__field">
                            <label class="cp-label login__label" for="username">{text.USERNAME}</label>
                            <input id="username"
                                   class={usernameClass}
                                   data-id="username"
                                   type="text"
                                   name="username"
                                   autocomplete="username"
                                   autocapitalize="off"
                                   spellcheck="false"
                                   placeholder={text.USERNAME_PLACEHOLDER}
                                   value={username}
                                   aria-invalid={loginInvalid}
                                   aria-describedby="login-error"
                                   oninput={handleUsernameInput} />
                        </div>

                        <div class="cp-field login__field">
                            <label class="cp-label login__label" for="password">{text.PASSWORD}</label>
                            <div class="login__password">
                                <input id="password"
                                       class={passwordClass}
                                       data-id="password"
                                       type={passwordType}
                                       name="password"
                                       autocomplete="current-password"
                                       placeholder={text.PASSWORD_PLACEHOLDER}
                                       value={password}
                                       aria-invalid={loginInvalid}
                                       aria-describedby="login-error"
                                       oninput={handlePasswordInput} />
                                <button type="button"
                                        class={eyeClass}
                                        data-id="toggle-password"
                                        aria-label={text.SHOW_PASSWORD}
                                        aria-pressed={passwordShownState}
                                        aria-controls="password"
                                        onclick={handleTogglePassword}>
                                    <template lwc:if={showEyeOff}>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.94 13.84C12.4 13.84 12.85 13.66 13.17 13.33C13.5 13 13.69 12.56 13.69 12.09C13.69 12.04 13.68 11.99 13.68 11.94L11.79 13.84C11.84 13.84 11.89 13.84 11.94 13.84M17.73 6.68L17.06 6.01C17.04 5.99 17.01 5.98 16.97 5.98C16.94 5.98 16.91 5.99 16.89 6.01L15.18 7.72C14.24 7.24 13.18 7 12 7C9 7 6.76 8.56 5.28 11.69C5.22 11.82 5.19 11.96 5.19 12.1C5.19 12.23 5.22 12.37 5.28 12.5C5.87 13.74 6.58 14.74 7.41 15.49L5.76 17.14C5.74 17.16 5.72 17.2 5.72 17.23C5.72 17.26 5.74 17.29 5.76 17.32L6.43 17.99C6.45 18.01 6.48 18.02 6.51 18.02C6.55 18.02 6.58 18.01 6.6 17.99L17.73 6.86C17.74 6.85 17.75 6.83 17.76 6.82C17.76 6.8 17.77 6.79 17.77 6.77C17.77 6.75 17.76 6.74 17.76 6.72C17.75 6.71 17.74 6.69 17.73 6.68M9.19 12.09C9.19 11.62 9.31 11.15 9.54 10.74C9.78 10.33 10.12 9.98 10.52 9.74C10.93 9.49 11.39 9.36 11.87 9.35C12.34 9.33 12.81 9.44 13.23 9.67L12.47 10.43C12.17 10.33 11.84 10.32 11.53 10.39C11.21 10.47 10.93 10.63 10.7 10.86C10.47 11.09 10.31 11.37 10.24 11.68C10.16 12 10.17 12.32 10.27 12.63L9.51 13.39C9.3 12.99 9.19 12.55 9.19 12.09M18.72 11.69C18.17 10.53 17.52 9.59 16.76 8.86L14.51 11.11C14.7 11.61 14.74 12.15 14.63 12.67C14.52 13.19 14.26 13.66 13.88 14.04C13.51 14.41 13.03 14.67 12.51 14.78C11.99 14.89 11.45 14.85 10.95 14.66L9.04 16.57C9.93 16.98 10.92 17.19 12 17.19C15 17.19 17.24 15.62 18.72 12.5C18.78 12.37 18.81 12.23 18.81 12.09C18.81 11.95 18.78 11.82 18.72 11.69"></path></svg>
                                    </template>
                                    <template lwc:else>
                                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.17 12C10.17 12.46 10.36 12.91 10.69 13.24C11.01 13.57 11.46 13.75 11.92 13.75C12.39 13.75 12.83 13.57 13.16 13.24C13.49 12.91 13.67 12.46 13.67 12C13.67 11.54 13.49 11.09 13.16 10.76C12.83 10.43 12.39 10.25 11.92 10.25C11.46 10.25 11.01 10.43 10.69 10.76C10.36 11.09 10.17 11.54 10.17 12M18.71 11.6C17.23 8.48 14.99 6.91 11.98 6.91C8.98 6.91 6.74 8.48 5.26 11.6C5.2 11.72 5.17 11.86 5.17 12C5.17 12.14 5.2 12.28 5.26 12.4C6.74 15.52 8.98 17.09 11.98 17.09C14.99 17.09 17.23 15.52 18.71 12.4C18.83 12.15 18.83 11.85 18.71 11.6M11.92 14.75C10.4 14.75 9.17 13.52 9.17 12C9.17 10.48 10.4 9.25 11.92 9.25C13.44 9.25 14.67 10.48 14.67 12C14.67 13.52 13.44 14.75 11.92 14.75"></path></svg>
                                    </template>
                                </button>
                            </div>
                            <p id="login-error" class="cp-error login__error" data-id="login-error" role="alert">{loginError}</p>
                        </div>

                        <a class="login__forgot" href={forgotPasswordUrl}>{text.FORGOT_PASSWORD}</a>

                        <button class={loginButtonClass} data-id="login" type="submit" disabled={loginDisabled}>
                            <template lwc:if={isBusy}><span class="login__spinner" aria-hidden="true"></span></template>
                            <span>{text.LOGIN}</span>
                        </button>
                    </form>

                    <button type="button" class="cp-btn cp-btn_link login__link login__link_issue" data-id="open-issue" onclick={handleOpenIssue}>{text.FACING_ISSUE}</button>
                </template>

                <!-- ================= FACING AN ISSUE (Figma pages 3-4) ================= -->
                <template lwc:else>
                    <form class="login__form" novalidate aria-busy={sendingState} onsubmit={handleSubmitIssue}>
                        <div class="cp-field login__field">
                            <label class="cp-label login__label" for="issue-email">{text.EMAIL}</label>
                            <input id="issue-email"
                                   class={emailClass}
                                   data-id="email"
                                   type="email"
                                   name="email"
                                   autocomplete="email"
                                   autocapitalize="off"
                                   spellcheck="false"
                                   maxlength="80"
                                   placeholder={text.EMAIL_PLACEHOLDER}
                                   value={email}
                                   aria-invalid={emailInvalid}
                                   aria-describedby="issue-email-error"
                                   oninput={handleEmailInput} />
                            <p id="issue-email-error" class="cp-error login__error" data-id="email-error">{emailError}</p>
                        </div>

                        <div class="cp-field login__field">
                            <label class="cp-label login__label" for="issue-mobile">{text.MOBILE}</label>
                            <input id="issue-mobile"
                                   class={mobileClass}
                                   data-id="mobile"
                                   type="tel"
                                   name="mobile"
                                   autocomplete="tel"
                                   inputmode="tel"
                                   maxlength="40"
                                   placeholder={text.MOBILE_PLACEHOLDER}
                                   value={mobile}
                                   aria-invalid={mobileInvalid}
                                   aria-describedby="issue-mobile-error"
                                   oninput={handleMobileInput} />
                            <p id="issue-mobile-error" class="cp-error login__error" data-id="mobile-error">{mobileError}</p>
                        </div>

                        <div class="cp-field login__field">
                            <label class="cp-label login__label" for="issue-text">{text.ISSUE}</label>
                            <textarea id="issue-text"
                                      class={issueTextClass}
                                      data-id="issue-text"
                                      name="description"
                                      maxlength={maxDescription}
                                      placeholder={text.ISSUE_PLACEHOLDER}
                                      value={issueText}
                                      aria-invalid={issueTextInvalid}
                                      aria-describedby="issue-text-error"
                                      oninput={handleIssueTextInput}></textarea>
                            <p id="issue-text-error" class="cp-error login__error" data-id="issue-text-error">{issueTextError}</p>
                        </div>

                        <p class="cp-error login__error login__error_form" data-id="issue-error" role="alert">{issueError}</p>

                        <button class={submitButtonClass} data-id="submit-issue" type="submit" disabled={submitDisabled}>
                            <template lwc:if={isSending}><span class="login__spinner" aria-hidden="true"></span></template>
                            <span>{text.SUBMIT}</span>
                        </button>
                    </form>

                    <button type="button" class="cp-btn cp-btn_link login__link login__link_back" data-id="back" onclick={handleBack}>{text.BACK}</button>
                </template>
            </div>
        </main>

        <!-- ================= SUBMITTED (Figma page 5) ================= -->
        <template lwc:if={showSubmitted}>
            <div class="cp-modal-overlay" role="presentation" data-id="submitted-overlay" onclick={handleOverlayClick} onkeydown={handleModalKeydown}>
                <section class="cp-modal login__modal" role="dialog" aria-modal="true" aria-labelledby="submitted-title" aria-describedby="submitted-text" data-id="submitted">
                    <button type="button" class="cp-close cp-modal__close" data-id="close-submitted" title={text.CLOSE} aria-label={text.CLOSE} onclick={handleCloseSubmitted}>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41"></path></svg>
                    </button>
                    <div class="login__success">
                        <div class="login__success-icon" style={submittedIconStyle} aria-hidden="true"></div>
                        <h2 id="submitted-title" class="cp-success__title login__success-title">{text.SUBMITTED_TITLE}</h2>
                        <p id="submitted-text" class="cp-success__text login__success-text">
                            <span class="login__line">{text.SUBMITTED_TEXT_LINE_1}</span>
                            <span class="login__line">{text.SUBMITTED_TEXT_LINE_2}</span>
                        </p>
                    </div>
                </section>
            </div>
        </template>
    </div>
</template>
