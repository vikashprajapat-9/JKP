<template>
    <!-- ================= LOCATION VIEW ================= -->
    <template lwc:if={isLocationView}>
        <button class="back-link" type="button" onclick={handleBackToDetail}>
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                <path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span>Back</span>
        </button>

        <div class="map-frame">
            <template lwc:if={hasAddress}>
                <lightning-map map-markers={mapMarkers} zoom-level="14" list-view="hidden"></lightning-map>
            </template>
            <template lwc:else>
                <div class="map-empty">No address is available for this project yet.</div>
            </template>
        </div>

        <template lwc:if={hasAddress}>
            <div class="map-actions">
                <span class="map-address">{location}</span>
                <button class="btn-outline small" type="button" onclick={handleOpenMaps}>Open in Google Maps</button>
            </div>
        </template>
    </template>

    <!-- ================= DETAIL VIEW ================= -->
    <template lwc:else>
        <button class="back-icon" type="button" onclick={handleBack} aria-label="Back to projects">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                <path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>

        <template lwc:if={loadError}>
            <p class="load-error" role="alert">{loadError}</p>
        </template>

        <div class="detail-grid">
            <!-- LEFT COLUMN -->
            <div class="col-left">
                <div class="hero" onmouseenter={handleHeroEnter} onmouseleave={handleHeroLeave} onfocusin={handleHeroFocusIn} onfocusout={handleHeroFocusOut}>
                    <template lwc:if={hasSlides}>
                        <template for:each={slides} for:item="slide">
                            <div key={slide.key} class={slide.slideClass}>
                                <img class="hero-img" src={slide.url} alt={name} />
                            </div>
                        </template>
                    </template>
                    <template lwc:else>
                        <div class="hero-placeholder" aria-hidden="true">
                            <svg class="hero-building" viewBox="0 0 120 120">
                                <rect x="18" y="38" width="30" height="72" rx="2" fill="currentColor" opacity="0.55"></rect>
                                <rect x="52" y="14" width="34" height="96" rx="2" fill="currentColor" opacity="0.8"></rect>
                                <rect x="90" y="52" width="16" height="58" rx="2" fill="currentColor" opacity="0.45"></rect>
                            </svg>
                        </div>
                    </template>

                    <template lwc:if={statusBadge}>
                        <span class="phase-badge">{statusBadge}</span>
                    </template>

                    <template lwc:if={hasMultipleSlides}>
                        <button class="hero-nav hero-nav_prev" type="button" onclick={handlePrevSlide} aria-label="Previous photo">‹</button>
                        <button class="hero-nav hero-nav_next" type="button" onclick={handleNextSlide} aria-label="Next photo">›</button>
                        <div class="hero-dots">
                            <template for:each={slides} for:item="slide">
                                <button key={slide.dotKey}
                                        class={slide.dotClass}
                                        type="button"
                                        data-index={slide.index}
                                        aria-label={slide.dotLabel}
                                        onclick={handleDotClick}></button>
                            </template>
                        </div>
                    </template>

                    <div class="hero-overlay">
                        <h1 class="hero-name">{name}</h1>
                        <template lwc:if={location}>
                            <p class="hero-location">
                                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                    <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"></path>
                                    <circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                                </svg>
                                <span>{location}</span>
                            </p>
                        </template>
                    </div>
                </div>

                <button class="btn-outline" type="button" onclick={handleViewLocation}>View Location</button>

                <div class="fact-row">
                    <div class="fact-card">
                        <span class="fact-label">POSSESSION</span>
                        <span class="fact-value">{possessionText}</span>
                    </div>
                    <div class="fact-card">
                        <span class="fact-label">LAND PARCEL</span>
                        <span class="fact-value">{landParcelText}</span>
                    </div>
                </div>

                <template lwc:if={hasAmenities}>
                    <div class="panel">
                        <h2 class="panel-title">Key Amenities</h2>
                        <div class="amenity-row">
                            <template for:each={amenities} for:item="amenity">
                                <div key={amenity.key} class="amenity">
                                    <span class="amenity-icon">
                                        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                                            <path d={amenity.icon} fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                        </svg>
                                    </span>
                                    <span class="amenity-label">{amenity.label}</span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="col-right">
                <h2 class="section-title">Configurations</h2>
                <template lwc:if={showSkeleton}>
                    <div class="config-card skeleton-card" aria-hidden="true">
                        <span class="skeleton-line skeleton-line_wide"></span>
                        <span class="skeleton-line"></span>
                    </div>
                    <div class="config-card skeleton-card" aria-hidden="true">
                        <span class="skeleton-line skeleton-line_wide"></span>
                        <span class="skeleton-line"></span>
                    </div>
                </template>
                <template for:each={configurations} for:item="config">
                    <div key={config.key} class="config-card">
                        <div class="config-top">
                            <div>
                                <p class="config-type">{config.type}</p>
                                <template lwc:if={config.hasArea}>
                                    <p class="config-area">
                                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                            <rect x="3" y="8" width="18" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                                            <path d="M7 8v3M11 8v4M15 8v3M19 8v4" stroke="currentColor" stroke-width="1.6"></path>
                                        </svg>
                                        {config.area}
                                    </p>
                                </template>
                            </div>
                            <div class="config-price">
                                <span class="price-label">STARTING AT</span>
                                <span class="price-value">{config.price}</span>
                            </div>
                        </div>
                        <template lwc:if={config.hasPriceSheet}>
                            <div class="doc-row">
                                <button class="doc-row-view" type="button" data-id={config.priceSheetId} aria-label={config.viewLabel} onclick={handleViewFile}>
                                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                                    </svg>
                                    View Price Sheet
                                </button>
                                <button class="doc-row-download" type="button" data-id={config.priceSheetId} aria-label={config.downloadLabel} title="Download" onclick={handleDownloadFile}>
                                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                        <path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </button>
                            </div>
                        </template>
                        <template lwc:else>
                            <p class="doc-row-empty">Price sheet coming soon</p>
                        </template>
                    </div>
                </template>
                <template lwc:if={showNoConfigurations}>
                    <p class="empty-note">Configurations will be listed here soon.</p>
                </template>

                <h2 class="section-title docs-title">Project Documents</h2>
                <template lwc:if={showSkeleton}>
                    <div class="doc-card skeleton-card" aria-hidden="true">
                        <span class="skeleton-line skeleton-line_wide"></span>
                    </div>
                </template>
                <template for:each={documents} for:item="doc">
                    <div key={doc.key} class="doc-card">
                        <span class="doc-icon">
                            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                                <path d={doc.icon} fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                        <span class="doc-name" title={doc.label}>{doc.label}</span>
                        <button class="doc-view" type="button" data-id={doc.id} aria-label={doc.viewLabel} onclick={handleViewFile}>View</button>
                        <button class="doc-download" type="button" data-id={doc.id} aria-label={doc.downloadLabel} title="Download" onclick={handleDownloadFile}>
                            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                                <path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                </template>
                <template lwc:if={showNoDocuments}>
                    <p class="empty-note">No project documents have been shared yet.</p>
                </template>
            </div>
        </div>

        <template lwc:if={viewerFile}>
            <c-partner-web-portal-file-viewer portal={portal} file={viewerFile} onclose={handleCloseViewer}></c-partner-web-portal-file-viewer>
        </template>
    </template>
</template>
