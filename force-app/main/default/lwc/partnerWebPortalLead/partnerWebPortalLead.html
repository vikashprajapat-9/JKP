<template>

    <!-- ============================================ -->
    <!-- FORM VIEW                                     -->
    <!-- ============================================ -->
    <template lwc:if={isFormView}>
        <div class="form-wrapper">

            <!-- FORM HEADER -->
            <div class="form-header">
                <button class="back-btn" onclick={handleFormCancel} type="button" title="Back" aria-label="Back">
                    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
                        <path d="M20 12H4M10 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <h2 class="form-title">Add Lead</h2>
            </div>

            <!-- INLINE ERROR BANNER (FOR FORM VIEW) -->
            <template lwc:if={errorMessage}>
                <div class="alert-banner error-banner" role="alert" tabindex="-1">
                    <lightning-icon icon-name="utility:error" size="x-small" class="alert-icon"></lightning-icon>
                    <span class="alert-text">{errorMessage}</span>
                    <button class="banner-close-btn" onclick={handleCloseError} type="button" aria-label="Close">✕</button>
                </div>
            </template>

            <!-- CUSTOMER DETAILS -->
            <h3 class="section-title section-title_small">Customer Details</h3>

            <div class="field">
                <label for="fullName">Full Name (as per NIC) <span class="req">*</span></label>
                <input id="fullName"
                       class="jk-input"
                       type="text"
                       placeholder="e.g. John Thomas"
                       data-field="fullName"
                       value={form.fullName}
                       oninput={handleFormChange}
                       onchange={handleFormChange} />
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="phone">Mobile Number <span class="req">*</span></label>
                    <div class="phone-row">
                        <div class="dial-code" aria-hidden="true">
                            <span class="flag"></span>
                            <span>94</span>
                        </div>
                        <input id="phone"
                               class="jk-input"
                               type="text"
                               placeholder="Enter mobile number"
                               data-field="phone"
                               value={form.phone}
                               oninput={handleFormChange}
                               onchange={handleFormChange} />
                    </div>
                </div>
                <div class="field">
                    <label for="email">Email ID <span class="req">*</span></label>
                    <input id="email"
                           class="jk-input"
                           type="email"
                           placeholder="john.smith@example.com"
                           data-field="email"
                           value={form.email}
                           oninput={handleFormChange}
                           onchange={handleFormChange} />
                </div>
            </div>

            <div class="two-col">
                <div class="field">
                    <label for="company">Company</label>
                    <input id="company"
                           class="jk-input"
                           type="text"
                           placeholder="Company name"
                           data-field="company"
                           value={form.company}
                           oninput={handleFormChange}
                           onchange={handleFormChange} />
                </div>
                <div class="field">
                    <label for="address">Permanent Address</label>
                    <input id="address"
                           class="jk-input"
                           type="text"
                           placeholder="No. 42, Galle Road, Colombo 03, Sri Lanka"
                           data-field="address"
                           value={form.address}
                           oninput={handleFormChange}
                           onchange={handleFormChange} />
                </div>
            </div>

            <!-- PROJECT INTEREST -->
            <h3 class="section-title">Project Interest</h3>

            <div class="two-col">
                <div class="field">
                    <label for="project" class="label-lg">Interested Project <span class="req">*</span></label>
                    <div class="select-wrap">
                        <select id="project" class="jk-input jk-select" data-field="project" value={form.project} onchange={handleFormChange}>
                            <option value="">Select</option>
                            <template for:each={projectOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                </div>
                <div class="field">
                    <label for="budget">Budget Aligned <span class="req">*</span></label>
                    <div class="select-wrap">
                        <select id="budget" class="jk-input jk-select" data-field="budget" value={form.budget} onchange={handleFormChange}>
                            <option value="">Select</option>
                            <template for:each={budgetOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- REMARKS -->
            <h3 class="section-title">Additional Remarks</h3>

            <div class="field">
                <label for="description">Specific Requirements (Budget, Preferred Floor, Time of Visit)</label>
                <textarea id="description"
                          class="jk-input jk-textarea"
                          rows="5"
                          placeholder="Mention any specific details that might help in conversion..."
                          data-field="description"
                          value={form.description}
                          oninput={handleFormChange}
                          onchange={handleFormChange}></textarea>
            </div>

            <!-- FORM FOOTER -->
            <div class="form-footer">
                <p class="form-note">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
                        <path d="M12 11v6M12 7.5v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                    All fields marked <span class="req">*</span> are mandatory.
                </p>
                <div class="footer-actions">
                    <button class="cancel-btn" type="button" onclick={handleFormCancel}>
                        Cancel
                    </button>
                    <button class="save-btn"
                            type="button"
                            onclick={handleRegisterLead}
                            disabled={isSaving}>
                        {saveButtonLabel}
                    </button>
                </div>
            </div>

        </div>
    </template>

    <!-- ============================================ -->
    <!-- LIST VIEW                                     -->
    <!-- ============================================ -->
    <template lwc:else>
        <div class="container">

            <!-- SUCCESS / NOTICE MODAL (FOR LIST VIEW) -->
            <template lwc:if={showSuccess}>
                <div class="modal-backdrop" onclick={handleCloseSuccess}></div>
                <div class="modal" role="dialog" aria-modal="true" aria-labelledby="leadSuccessTitle">
                    <button class="modal-close" onclick={handleCloseSuccess} type="button" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                        </svg>
                    </button>
                    <template lwc:if={isApprovalRequested}>
                        <div class="modal-illustration" aria-hidden="true">
                            <svg viewBox="0 0 120 120" width="120" height="120">
                                <circle cx="60" cy="60" r="56" fill="#e4edff"></circle>
                                <circle cx="60" cy="60" r="40" fill="#112149"></circle>
                                <circle cx="60" cy="44" r="5" fill="#fff"></circle>
                                <path d="M60 56v24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"></path>
                            </svg>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="modal-illustration" aria-hidden="true">
                            <svg viewBox="0 0 120 120" width="120" height="120">
                                <circle cx="60" cy="60" r="56" fill="#e4edff"></circle>
                                <circle cx="60" cy="60" r="40" fill="#112149"></circle>
                                <path d="M42 61l12 12 24-26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                    </template>
                    <h3 id="leadSuccessTitle" class="modal-title">{successTitle}</h3>
                    <template lwc:if={isApprovalRequested}>
                        <p class="modal-text notice-text">{leadNotice.message}</p>
                        <p class="modal-subtext">{successMessage}</p>
                    </template>
                    <template lwc:else>
                        <p class="modal-text">
                            Your new lead has been created successfully and is now in your Leads list.
                        </p>
                        <template lwc:if={leadNotice}>
                            <p class="modal-notice notice-text" role="note">{leadNotice.message}</p>
                        </template>
                        <p class="modal-subtext">{successMessage}</p>
                    </template>
                </div>
            </template>

            <!-- EDIT POPUP: the lead's new stage and what it needs -->
            <template lwc:if={editLeadId}>
                <c-partner-web-portal-lead-edit lead-id={editLeadId} onsaved={handleEditSaved} onclose={handleEditClose}>
                </c-partner-web-portal-lead-edit>
            </template>

            <!-- DOCUMENTS POPUP (on hold since 2026-10-07: document collection is hidden on the portal until the client
                 confirms it; to switch it back on, remove this comment around the block below and around the row's
                 Documents button)
            <template lwc:if={docsLeadId}>
                <c-partner-web-portal-lead-documents lead-id={docsLeadId} onclose={handleDocumentsClose}>
                </c-partner-web-portal-lead-documents>
            </template>
            -->

            <!-- SAVED BANNER (LIST VIEW) -->
            <template lwc:if={infoMessage}>
                <div class="alert-banner info-banner" role="status">
                    <lightning-icon icon-name="utility:success" size="x-small" class="alert-icon"></lightning-icon>
                    <span class="alert-text">{infoMessage}</span>
                    <button class="banner-close-btn" onclick={handleCloseInfo} type="button" aria-label="Close">✕</button>
                </div>
            </template>

            <!-- ERROR BANNER (LIST VIEW) -->
            <template lwc:if={errorMessage}>
                <div class="alert-banner error-banner" role="alert" tabindex="-1">
                    <lightning-icon icon-name="utility:error" size="x-small" class="alert-icon"></lightning-icon>
                    <span class="alert-text">{errorMessage}</span>
                    <button class="banner-close-btn" onclick={handleCloseError} type="button" aria-label="Close">✕</button>
                </div>
            </template>

            <!-- HEADER -->
            <div class="page-head">
                <h1 class="page-title">Leads</h1>
                <p class="page-desc">
                    Manage and add new leads effortlessly with our comprehensive tracking system.
                    Access detailed information about each lead, including contact details, lead source,
                    and current stage. Stay organized and ensure timely follow-ups to maximize your
                    conversion rates with the support of John Keells Properties
                </p>
            </div>

            <!-- ADD BUTTON -->
            <button class="add-tile" onclick={handleNavigation} type="button">
                <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
                    <path d="M20 2v36M2 20h36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
                </svg>
                <span>Add New Lead</span>
            </button>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                        <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search.."
                        aria-label="Search leads"
                        oninput={handleSearch} />
                </div>
                <div class="action-buttons">
                    <button class="btn-export" type="button" onclick={handleExport} disabled={noLeads}>
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M8 11H5v10h14V11h-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Export CSV
                    </button>
                </div>
            </div>

            <!-- FILTER CHIPS -->
            <div class="filter-tabs">
                <template for:each={filterButtons} for:item="tab">
                    <button
                        key={tab.value}
                        type="button"
                        class={tab.className}
                        data-value={tab.value}
                        aria-pressed={tab.pressed}
                        onclick={handleFilterClick}>
                        {tab.label}
                    </button>
                </template>
            </div>

            <!-- TABLE -->
            <div class="table-wrapper">
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th class="col-sr">Sr.</th>
                            <th>Lead Created Date</th>
                            <th>Lead No.</th>
                            <th>Lead Name</th>
                            <th>Channel Partner/Company Name</th>
                            <th>Project Name</th>
                            <th>Lead Mobile No.</th>
                            <th>Lead Stage</th>
                            <th class="col-actions">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template if:true={hasLeads}>
                            <template for:each={leads} for:item="lead">
                                <tr key={lead.rowNo}>
                                    <td class="col-sr">{lead.rowNo}</td>
                                    <td>{lead.createdDate}</td>
                                    <td class="col-leadno">{lead.leadNo}</td>
                                    <td class="col-name">{lead.leadName}</td>
                                    <td class="col-name">{lead.partner}</td>
                                    <td class="col-name">{lead.project}</td>
                                    <td>{lead.mobile}</td>
                                    <td><span class={lead.badgeClass}>{lead.stage}</span></td>
                                    <td class="col-actions">
                                        <div class="row-actions">
                                        <template lwc:if={lead.canEdit}>
                                            <button type="button" class="row-edit-btn" data-id={lead.leadId} onclick={handleEdit}
                                                aria-label={lead.editLabel} title="Update the lead stage">
                                                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                                                    <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"></path>
                                                    <path d="M13.5 7.5l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
                                                </svg>
                                                Edit
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <!-- Opens the popup, which says why the lead cannot be edited (a tooltip alone is not seen on phones) -->
                                            <button type="button" class="row-locked" data-id={lead.leadId} onclick={handleEdit}
                                                title={lead.readOnlyReason} aria-label={lead.viewLabel}>
                                                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                                    <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"></rect>
                                                    <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.9"></path>
                                                </svg>
                                                View only
                                            </button>
                                        </template>
                                        <!-- DOCUMENTS BUTTON (on hold since 2026-10-07, see the Documents popup above)
                                        <template lwc:if={lead.canUploadDocuments}>
                                            <button type="button" class="row-docs-btn" data-id={lead.leadId} onclick={handleDocuments}
                                                aria-label={lead.documentsLabel} title="Upload the customer's documents">
                                                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                                                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"></path>
                                                    <path d="M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"></path>
                                                </svg>
                                                Documents
                                            </button>
                                        </template>
                                        -->
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </template>

                        <template if:true={noLeads}>
                            <tr>
                                <td colspan="9" class="no-data">No leads found</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination">
                <div class="entries-text">{entriesText}</div>
                <div class="pagination-controls">
                    <button class="page-arrow" type="button" onclick={handlePrev} disabled={isPrevDisabled}>
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Prev
                    </button>
                    <template for:each={paginationButtons} for:item="p">
                        <button
                            key={p.value}
                            type="button"
                            class={p.className}
                            data-value={p.value}
                            onclick={handlePageClick}>
                            {p.label}
                        </button>
                    </template>
                    <button class="page-arrow" type="button" onclick={handleNext} disabled={isNextDisabled}>
                        Next
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

</template>
