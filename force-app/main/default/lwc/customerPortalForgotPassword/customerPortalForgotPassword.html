<template>
    <div class="forgot">
        <div class="forgot__photo" style={photoStyle} aria-hidden="true"></div>

        <main class="forgot__panel">
            <div class="forgot__column">
                <div class="forgot__logo" style={logoStyle} role="img" aria-label={text.LOGO_LABEL}></div>

                <!-- ================= USERNAME ================= -->
                <template lwc:if={showForm}>
                    <h1 class="forgot__title">{text.TITLE}</h1>
                    <p class="forgot__intro">{text.INTRO}</p>

                    <form class="forgot__form" novalidate aria-busy={busyState} onsubmit={handleSubmit}>
                        <div class="cp-field forgot__field">
                            <label class="cp-label forgot__label" for="username">{text.USERNAME}</label>
                            <input id="username"
                                   class={usernameClass}
                                   data-id="username"
                                   type="text"
                                   name="username"
                                   autocomplete="username"
                                   autocapitalize="off"
                                   spellcheck="false"
                                   maxlength={maxUsername}
                                   placeholder={text.USERNAME_PLACEHOLDER}
                                   value={username}
                                   aria-invalid={invalidState}
                                   aria-describedby="forgot-error"
                                   oninput={handleUsernameInput} />
                            <p id="forgot-error" class="cp-error forgot__error" data-id="error" role="alert">{error}</p>
                        </div>

                        <button class={submitClass} data-id="reset" type="submit" disabled={isBusy} aria-disabled={emptyState}>
                            <template lwc:if={isBusy}><span class="forgot__spinner" aria-hidden="true"></span></template>
                            <span>{text.RESET}</span>
                        </button>
                    </form>

                    <a class="forgot__back" data-id="back-to-login" href={loginUrl}>{text.BACK_TO_LOGIN}</a>
                </template>

                <!-- ================= EMAIL SENT (picture of Figma page 5) ================= -->
                <template lwc:else>
                    <section class="forgot__sent" data-id="sent" aria-labelledby="sent-title">
                        <div class="forgot__sent-icon" style={sentIconStyle} aria-hidden="true"></div>
                        <h1 id="sent-title" class="forgot__sent-title" data-id="sent-title" tabindex="-1">{text.SENT_TITLE}</h1>
                        <p class="forgot__sent-text" data-id="sent-text">{text.SENT_BEFORE}<strong class="forgot__sent-name">{sentTo}</strong>{text.SENT_AFTER}</p>
                        <p class="forgot__sent-note">{text.SENT_NOTE}</p>
                        <a class="cp-btn cp-btn_lg cp-btn_block forgot__login" data-id="sent-back-to-login" href={loginUrl}>{text.BACK_TO_LOGIN}</a>
                        <button type="button" class="cp-btn cp-btn_link forgot__again" data-id="try-again" onclick={handleTryAgain}>{text.TRY_AGAIN}</button>
                    </section>
                </template>
            </div>
        </main>
    </div>
</template>
