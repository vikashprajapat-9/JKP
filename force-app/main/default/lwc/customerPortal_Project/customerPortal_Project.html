<template>
    <div class="projects-root">

        <template if:true={isLoading}>
            <div class="state-wrapper">
                <lightning-spinner alternative-text="Loading projects" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="state-wrapper">
                <lightning-icon icon-name="utility:error" size="medium" variant="error"></lightning-icon>
                <p>We couldn't load projects right now. Please try again in a moment.</p>
            </div>
        </template>

        <template if:true={showListView}>
            <h1 class="page-heading">Projects</h1>
            <p class="page-description">{introText}</p>

            <div class="tabs">
                <button class={currentTabClass} onclick={handleShowCurrent}>Current Projects</button>
                <button class={upcomingTabClass} onclick={handleShowUpcoming}>Upcoming Projects</button>
            </div>

            <template if:true={hasVisibleProjects}>
                <div class="projects-grid">
                    <template for:each={visibleProjects} for:item="project">
                        <div key={project.id} class="project-card">

                            <div class="card-image-wrapper">
                                <img src={project.activeImageUrl} class="card-image" alt={project.name} />

                                <template if:true={project.hasMultipleImages}>
                                    <button
                                        class="carousel-arrow carousel-arrow_left"
                                        data-id={project.id}
                                        title="Previous image"
                                        onclick={handleCardPrevImage}
                                    >
                                        <lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon>
                                    </button>
                                    <button
                                        class="carousel-arrow carousel-arrow_right"
                                        data-id={project.id}
                                        title="Next image"
                                        onclick={handleCardNextImage}
                                    >
                                        <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                                    </button>

                                    <div class="carousel-dots">
                                        <template for:each={project.dots} for:item="dot">
                                            <span key={dot.key} class={dot.dotClass}></span>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <div class="card-body">
                                <div class="card-title-row">
                                    <h3 class="card-name">{project.name}</h3>
                                </div>
                                <p class="card-location">{project.location}</p>

                                <p class="card-bhk">{project.bhk}</p>
                                <p class="card-type-label">{project.typeLabel}</p>

                                <button
                                    class="view-details-btn"
                                    data-id={project.id}
                                    onclick={handleViewDetails}
                                >View Details</button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={hasVisibleProjects}>
                <p class="empty-state">No projects to show in this category yet.</p>
            </template>
        </template>

        <template if:true={showDetailsView}>
            <div class="details-top-row">
                <button class="back-btn" title="Back to projects" onclick={handleBack}>
                    <lightning-icon icon-name="utility:back" size="small"></lightning-icon>
                </button>
                <!-- <button class="schedule-visit-btn" onclick={handleScheduleVisit}>Schedule Visit</button> -->
            </div>

            <div class="details-hero">
                <img src={selectedProject.activeImageUrl} class="hero-image" alt={selectedProject.name} />

                <template if:true={selectedProject.hasMultipleImages}>
                    <button class="hero-arrow hero-arrow_left" title="Previous image" onclick={handleDetailsPrevImage}>
                        <lightning-icon icon-name="utility:chevronleft" size="small"></lightning-icon>
                    </button>
                    <button class="hero-arrow hero-arrow_right" title="Next image" onclick={handleDetailsNextImage}>
                        <lightning-icon icon-name="utility:chevronright" size="small"></lightning-icon>
                    </button>

                    <div class="hero-dots">
                        <template for:each={selectedProject.dots} for:item="dot">
                            <span key={dot.key} class={dot.dotClass}></span>
                        </template>
                    </div>
                </template>
            </div>

            <div class="details-header-row">
                <h2 class="details-name">{selectedProject.name}</h2>
                <div class="details-actions">
                    <button class="brochure-btn" onclick={handleDownloadBrochure}>Download Brochure</button>
                </div>
            </div>

            <div class="summary-row">
                <div class="summary-item">
                    <p class="summary-value">{selectedProject.priceValue}</p>
                    <p class="summary-label">{selectedProject.priceCurrency}</p>
                </div>
                <div class="summary-item">
                    <p class="summary-value">{selectedProject.possessionDate}</p>
                    <p class="summary-label">Possession Date</p>
                </div>
                <div class="summary-item">
                    <p class="summary-value">{selectedProject.homesLeft}</p>
                    <p class="summary-label">Homes Left</p>
                </div>
            </div>

            <div class="spec-grid">
                <template for:each={selectedProject.specs} for:item="spec">
                    <div key={spec.key} class="spec-cell">
                        <p class="spec-value">{spec.value}</p>
                        <p class="spec-label">{spec.label}</p>
                    </div>
                </template>
            </div>

            <div class="amenities-section">
                <h3 class="section-heading">Amenities</h3>
                <div class="amenities-list">
                    <template for:each={selectedProject.amenities} for:item="amenity">
                        <div key={amenity.key} class="amenity-item">
                            <span class={amenity.iconWrapClass}>
                                <template if:true={amenity.isWater}>
                                    <svg viewBox="0 0 24 24" class="amenity-svg" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2.5 8.5c0-.83.67-1.5 1.5-1.5h11.5a3.5 3.5 0 0 1 3.5 3.5H4a1.5 1.5 0 0 1-1.5-1.5Z" fill="currentColor"/>
                                        <path d="M19 7h1.5a2.5 2.5 0 0 1 0 5H19a1 1 0 0 1 0-2h1a.5.5 0 0 0 0-1h-1a1 1 0 0 1 0-2Z" fill="currentColor"/>
                                        <circle cx="6.2" cy="7" r="2.4" fill="currentColor"/>
                                        <path d="M10.2 13.8c1.6 2 1.6 4.6 0 6.6-1.6-2-1.6-4.6 0-6.6Z" fill="currentColor"/>
                                    </svg>
                                </template>
                                <template if:true={amenity.isGarbage}>
                                    <svg viewBox="0 0 24 24" class="amenity-svg" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M4 7.5h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2Z" fill="currentColor"/>
                                        <path d="M9 7.5V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7.5h-6Z" fill="currentColor"/>
                                        <path d="M5.6 10 6.8 20.3A2 2 0 0 0 8.8 22h6.4a2 2 0 0 0 2-1.7L18.4 10H5.6Z" fill="currentColor"/>
                                        <rect x="9.5" y="12.5" width="1.6" height="6.5" rx="0.8" fill="var(--jk-white)"/>
                                        <rect x="13" y="12.5" width="1.6" height="6.5" rx="0.8" fill="var(--jk-white)"/>
                                    </svg>
                                </template>
                                <template if:true={amenity.isPark}>
                                    <svg viewBox="0 0 24 24" class="amenity-svg" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M7.3 2.5c2.4 2 2.9 4 2.4 6a3.9 3.9 0 0 1-2 2.4c1 .1 1.9.6 2.3 1.4-.5 1.6-1.7 2.4-2.7 2.7v6h-2v-6c-1-.3-2.2-1.1-2.7-2.7.4-.8 1.3-1.3 2.3-1.4a3.9 3.9 0 0 1-2-2.4c-.5-2 0-4 2.4-6Z" fill="currentColor"/>
                                        <path d="M16.7 5.2c2 1.7 2.5 3.4 2 5.1a3.3 3.3 0 0 1-1.7 2c.9.1 1.6.5 2 1.2-.4 1.4-1.4 2-2.3 2.3v5.2h-1.9v-5.2c-.9-.3-1.9-.9-2.3-2.3.4-.7 1.1-1.1 2-1.2a3.3 3.3 0 0 1-1.7-2c-.5-1.7 0-3.4 2-5.1Z" fill="currentColor"/>
                                    </svg>
                                </template>
                                <template if:true={amenity.isPool}>
                                    <svg viewBox="0 0 24 24" class="amenity-svg" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="15.6" cy="4.6" r="1.9" fill="currentColor"/>
                                        <path d="M4 10.2c2.4-2.6 4.7-3.7 6.6-3.2 1 .3 1.6 1 2.3 1.9.6.8 1.1 1.3 1.9 1.1.6-.1 1-.6 1.6-1.4l1.5 1.2c-.8 1.2-1.7 2.1-3 2.3-1.4.2-2.4-.5-3.2-1.4-.6-.7-1-1.1-1.5-1.2-1-.3-2.5.4-4.4 2.4L4 10.2Z" fill="currentColor"/>
                                        <path d="M2.5 15.3c1.3 1.2 2.6 1.2 3.9 0 1.3-1.2 2.6-1.2 3.9 0 1.3 1.2 2.6 1.2 3.9 0 1.3-1.2 2.6-1.2 3.9 0 1.3 1.2 2.6 1.2 3.9 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                                        <path d="M2.5 19.2c1.3 1.2 2.6 1.2 3.9 0 1.3-1.2 2.6-1.2 3.9 0 1.3 1.2 2.6 1.2 3.9 0 1.3-1.2 2.6-1.2 3.9 0 1.3 1.2 2.6 1.2 3.9 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                                    </svg>
                                </template>
                            </span>
                            <span class="amenity-name">{amenity.name}</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>

    </div>
</template>
