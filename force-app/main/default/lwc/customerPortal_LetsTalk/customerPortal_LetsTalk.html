<template>
    <!-- Figma p93: brand title + intro, project picker (one column wide), 2 x 2 contact cards -->
    <div class="cp-page talk-page">
        <template lwc:if={isLoading}>
            <div class="cp-loading">
                <lightning-spinner alternative-text={text.loading} size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="cp-alert cp-alert_error talk-error" role="alert">
                <span class="talk-error__text">{text.error}</span>
                <button type="button" class="cp-btn cp-btn_sm cp-btn_secondary" onclick={handleRetry}>{text.retry}</button>
            </div>
        </template>

        <template lwc:elseif={showContent}>
            <div class="cp-page-head talk-head">
                <div class="cp-page-head__text">
                    <h1 class="cp-page-title cp-page-title_brand">{pageTitle}</h1>
                    <p class="cp-page-intro">{pageDescription}</p>
                </div>
            </div>

            <template lwc:if={hasProjects}>
                <div class="cp-select-wrap talk-select">
                    <select class="cp-select" aria-label={text.selectProject} onchange={handleProjectChange}>
                        <template for:each={projectOptions} for:item="option">
                            <option key={option.id} value={option.id} selected={option.isSelected}>{option.name}</option>
                        </template>
                    </select>
                </div>

                <template lwc:if={selectedProjectData}>
                    <div class="talk-grid">
                        <article class="cp-card talk-card">
                            <div class="talk-card__head">
                                <span class="talk-card__icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 6a5.3 5.3 0 0 0-5.3 5.3v.3c0 1.1.4 2.2 1 3.1l.4.5L12 18.3l3.9-3.1.4-.5c.6-.9 1-2 1-3.1v-.3A5.3 5.3 0 0 0 12 6z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path>
                                        <circle cx="12" cy="11.3" r="2.2" fill="none" stroke="currentColor" stroke-width="1"></circle>
                                    </svg>
                                </span>
                                <h2 class="talk-card__title">{text.propertyAddress}</h2>
                            </div>
                            <p class="talk-card__text">{selectedProjectData.propertyAddress}</p>
                            <button type="button" class="talk-card__action" onclick={handleOpenPropertyMap}>
                                <span class="talk-card__action-label">{text.openMaps}</span>
                                <svg class="talk-card__arrow" viewBox="0 0 17.2 17.2" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M0 8.6C0 3.9 3.9 0 8.6 0C13.3 0 17.2 3.9 17.2 8.6C17.2 13.3 13.3 17.2 8.6 17.2C3.9 17.2 0 13.3 0 8.6ZM8.8 5C8.6 5.2 8.6 5.6 8.8 5.8L11.1 8.1L4.8 8.1C4.6 8.1 4.3 8.3 4.3 8.6C4.3 8.9 4.6 9.1 4.8 9.1L11.1 9.1L8.8 11.4C8.6 11.6 8.6 12 8.8 12.2C9 12.4 9.3 12.4 9.5 12.2L12.7 9C12.9 8.8 12.9 8.4 12.7 8.2L9.5 5C9.3 4.8 9 4.8 8.8 5Z"></path>
                                </svg>
                            </button>
                        </article>

                        <article class="cp-card talk-card">
                            <div class="talk-card__head">
                                <span class="talk-card__icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M7.5 6.7L16.5 6.7C17.6 6.7 18.6 7.6 18.7 8.7L18.7 8.8L18.7 15.2C18.7 16.3 17.8 17.3 16.6 17.3L16.5 17.3L7.5 17.3C6.3 17.3 5.4 16.4 5.3 15.3L5.3 15.2L5.3 8.8C5.3 7.7 6.2 6.7 7.4 6.7L7.5 6.7L16.5 6.7L7.5 6.7ZM17.7 10.2L12.2 13.1C12.1 13.2 12 13.2 11.8 13.1L11.8 13.1L6.3 10.2L6.3 15.2C6.3 15.8 6.8 16.3 7.4 16.3L7.5 16.3L16.5 16.3C17.1 16.3 17.6 15.9 17.7 15.3L17.7 15.2L17.7 10.2ZM16.5 7.7L7.5 7.7C6.9 7.7 6.4 8.1 6.3 8.7L6.3 8.8L6.3 9.1L12 12.1L17.7 9.1L17.7 8.8C17.7 8.2 17.2 7.7 16.6 7.7L16.5 7.7Z"></path>
                                    </svg>
                                </span>
                                <h2 class="talk-card__title">{text.email}</h2>
                            </div>
                            <p class="talk-card__text">{selectedProjectData.email}</p>
                            <button type="button" class="talk-card__action" onclick={handleEmailUs}>
                                <span class="talk-card__action-label">{text.emailUs}</span>
                                <svg class="talk-card__arrow" viewBox="0 0 17.2 17.2" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M0 8.6C0 3.9 3.9 0 8.6 0C13.3 0 17.2 3.9 17.2 8.6C17.2 13.3 13.3 17.2 8.6 17.2C3.9 17.2 0 13.3 0 8.6ZM8.8 5C8.6 5.2 8.6 5.6 8.8 5.8L11.1 8.1L4.8 8.1C4.6 8.1 4.3 8.3 4.3 8.6C4.3 8.9 4.6 9.1 4.8 9.1L11.1 9.1L8.8 11.4C8.6 11.6 8.6 12 8.8 12.2C9 12.4 9.3 12.4 9.5 12.2L12.7 9C12.9 8.8 12.9 8.4 12.7 8.2L9.5 5C9.3 4.8 9 4.8 8.8 5Z"></path>
                                </svg>
                            </button>
                        </article>

                        <article class="cp-card talk-card">
                            <div class="talk-card__head">
                                <span class="talk-card__icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M8.7 5.6L9.5 5.4C10.4 5.1 11.3 5.5 11.7 6.4L12.3 7.7C12.6 8.4 12.4 9.3 11.9 9.8L10.9 10.7C10.8 10.8 10.8 10.8 10.8 10.8C10.8 11.1 11 11.6 11.4 12.3C11.7 12.9 11.9 13.2 12.2 13.4C12.3 13.6 12.4 13.6 12.5 13.6L13.8 13.2C14.6 12.9 15.4 13.2 15.8 13.9L16.7 15.1C17.2 15.8 17.1 16.8 16.5 17.4L15.9 18C15.2 18.6 14.3 18.8 13.5 18.6C11.6 18.1 10 16.5 8.5 14C7 11.4 6.5 9.2 7 7.4C7.2 6.5 7.9 5.9 8.7 5.6ZM9 6.6C8.5 6.7 8.1 7.1 8 7.6C7.6 9.2 8 11.1 9.4 13.5C10.7 15.8 12.2 17.2 13.8 17.6C14.2 17.8 14.8 17.6 15.2 17.3L15.8 16.7C16.1 16.4 16.1 16 15.9 15.6L15 14.4C14.8 14.2 14.4 14 14.1 14.1L12.8 14.6C12 14.8 11.3 14.2 10.5 12.8C10 11.9 9.8 11.3 9.8 10.7C9.8 10.4 10 10.2 10.2 10L11.2 9.1C11.4 8.8 11.5 8.4 11.4 8.1L10.8 6.8C10.6 6.4 10.2 6.2 9.8 6.3L9 6.6Z"></path>
                                    </svg>
                                </span>
                                <h2 class="talk-card__title">{text.crmContact}</h2>
                            </div>

                            <!-- One entry per booking on this project: the unit, then the person and their number -->
                            <template for:each={crmContacts} for:item="contact">
                                <div class="talk-contact" key={contact.id}>
                                    <template lwc:if={contact.unit}>
                                        <span class="cp-badge cp-badge_info talk-contact__unit">{contact.unit}</span>
                                    </template>
                                    <p class="talk-card__text talk-contact__person">{contact.display}</p>
                                </div>
                            </template>

                            <template lwc:if={noCrmContact}>
                                <p class="talk-card__text">{text.noContact}</p>
                            </template>

                            <template lwc:if={hasOneContact}>
                                <button type="button" class="talk-card__action" data-phone={singleContactPhoneUrl} onclick={handleCallUs}>
                                    <span class="talk-card__action-label">{text.callUs}</span>
                                    <svg class="talk-card__arrow" viewBox="0 0 17.2 17.2" aria-hidden="true">
                                        <path fill-rule="evenodd" d="M0 8.6C0 3.9 3.9 0 8.6 0C13.3 0 17.2 3.9 17.2 8.6C17.2 13.3 13.3 17.2 8.6 17.2C3.9 17.2 0 13.3 0 8.6ZM8.8 5C8.6 5.2 8.6 5.6 8.8 5.8L11.1 8.1L4.8 8.1C4.6 8.1 4.3 8.3 4.3 8.6C4.3 8.9 4.6 9.1 4.8 9.1L11.1 9.1L8.8 11.4C8.6 11.6 8.6 12 8.8 12.2C9 12.4 9.3 12.4 9.5 12.2L12.7 9C12.9 8.8 12.9 8.4 12.7 8.2L9.5 5C9.3 4.8 9 4.8 8.8 5Z"></path>
                                    </svg>
                                </button>
                            </template>
                        </article>

                        <article class="cp-card talk-card">
                            <div class="talk-card__head">
                                <span class="talk-card__icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M12 6a5.3 5.3 0 0 0-5.3 5.3v.3c0 1.1.4 2.2 1 3.1l.4.5L12 18.3l3.9-3.1.4-.5c.6-.9 1-2 1-3.1v-.3A5.3 5.3 0 0 0 12 6z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path>
                                        <circle cx="12" cy="11.3" r="2.2" fill="none" stroke="currentColor" stroke-width="1"></circle>
                                    </svg>
                                </span>
                                <h2 class="talk-card__title">{text.corporateAddress}</h2>
                            </div>
                            <p class="talk-card__text">{selectedProjectData.corporateAddress}</p>
                            <button type="button" class="talk-card__action" onclick={handleOpenCorporateMap}>
                                <span class="talk-card__action-label">{text.openMaps}</span>
                                <svg class="talk-card__arrow" viewBox="0 0 17.2 17.2" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M0 8.6C0 3.9 3.9 0 8.6 0C13.3 0 17.2 3.9 17.2 8.6C17.2 13.3 13.3 17.2 8.6 17.2C3.9 17.2 0 13.3 0 8.6ZM8.8 5C8.6 5.2 8.6 5.6 8.8 5.8L11.1 8.1L4.8 8.1C4.6 8.1 4.3 8.3 4.3 8.6C4.3 8.9 4.6 9.1 4.8 9.1L11.1 9.1L8.8 11.4C8.6 11.6 8.6 12 8.8 12.2C9 12.4 9.3 12.4 9.5 12.2L12.7 9C12.9 8.8 12.9 8.4 12.7 8.2L9.5 5C9.3 4.8 9 4.8 8.8 5Z"></path>
                                </svg>
                            </button>
                        </article>
                    </div>
                </template>
            </template>

            <template lwc:else>
                <div class="cp-empty">
                    <img class="cp-empty__img" src={emptyImg} alt="" />
                    <p class="cp-empty__text">{text.empty}</p>
                </div>
            </template>
        </template>
    </div>
</template>
