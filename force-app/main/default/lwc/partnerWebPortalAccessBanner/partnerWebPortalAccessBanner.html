<template>
    <div class={areaClass}>

        <!-- ================= ACCESS NOTICE ================= -->
        <template lwc:if={showBanner}>
            <section class={bannerClass} aria-label="Portal access" tabindex="-1">
                <span class="banner-icon" aria-hidden="true">
                    <template lwc:if={isInfoTone}>
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                            <path d="M3.5 9.5h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                        </svg>
                    </template>
                    <template lwc:elseif={isSoonTone}>
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                            <path d="M12 9v4.2l2.8 1.8M9.5 2.8h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </template>
                    <template lwc:elseif={isEndedTone}>
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                            <path d="M12 7v6M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                        </svg>
                    </template>
                    <template lwc:else>
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path d="M7 3.5h10M7 20.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            <path d="M8 3.5c0 4.3 4 5.2 4 8.5s-4 4.2-4 8.5M16 3.5c0 4.3-4 5.2-4 8.5s4 4.2 4 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
                            <path d="M10 18.8c.6-1.3 1.3-1.9 2-1.9s1.4.6 2 1.9z" fill="currentColor"></path>
                        </svg>
                    </template>
                </span>

                <div class="banner-copy">
                    <span class="banner-label">{bannerLabel}</span>
                    <p class="banner-text">{message}</p>
                </div>

                <template lwc:if={canRequest}>
                    <div class="banner-action">
                        <button type="button" class="request-btn" aria-haspopup="dialog" onclick={handleOpen}>
                            <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                                <rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"></rect>
                                <path d="M3.5 9.5h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                            </svg>
                            <span>Request extension</span>
                        </button>
                    </div>
                </template>
                <template lwc:elseif={isPending}>
                    <div class="banner-action">
                        <span class="badge badge-pending">Pending approval</span>
                    </div>
                </template>
            </section>
        </template>

        <!-- ================= CONFIRMATION (once a request is sent) ================= -->
        <div class="notice-region" role="status">
            <template lwc:if={notice}>
                <div class="sent-notice" tabindex="-1">
                    <svg class="sent-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                        <path d="M8 12.5l2.8 2.8 5.7-5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="sent-text">{notice}</span>
                    <button class="notice-close" type="button" onclick={handleCloseNotice} aria-label="Dismiss">✕</button>
                </div>
            </template>
        </div>
    </div>

    <!-- ================= EXTENSION REQUEST ================= -->
    <template lwc:if={isModalOpen}>
        <div class="modal-backdrop" onclick={handleCancel}></div>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="extension-title" aria-describedby="extension-intro" aria-busy={busyState}>
            <header class="modal-head">
                <span class="modal-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                        <path d="M3.5 9.5h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                    </svg>
                </span>
                <div class="modal-titles">
                    <h2 id="extension-title" class="modal-title">Request an extension</h2>
                    <p id="extension-intro" class="modal-intro">{modalIntro}</p>
                </div>
                <button class="close-btn" type="button" onmousedown={keepFocus} onclick={handleCancel} disabled={isSaving} aria-label="Close">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                </button>
            </header>

            <div class="modal-body">
                <div class="field">
                    <label class="field-label" for="extension-days">Extension period<abbr class="required-mark" title="required">*</abbr></label>
                    <div class="select-wrap">
                        <select id="extension-days" class={daysClass} data-field="days" required aria-required="true"
                                aria-invalid={daysInvalid} aria-describedby="extension-days-error" disabled={isSaving}
                                onchange={handleDaysChange} onblur={handleBlur}>
                            <option value="" disabled selected={noDaysChosen}>Select a period</option>
                            <template for:each={dayOptions} for:item="option">
                                <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                            </template>
                        </select>
                        <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <template lwc:if={daysError}>
                        <span class="field-error" id="extension-days-error">{daysError}</span>
                    </template>
                </div>

                <div class="field">
                    <label class="field-label" for="extension-reason">Reason<abbr class="required-mark" title="required">*</abbr></label>
                    <textarea id="extension-reason" class={reasonClass} data-field="reason" rows="5" maxlength={reasonMaxLength}
                              placeholder="Tell us why you need more time, for example the site visits or bookings you are working on."
                              required aria-required="true" aria-invalid={reasonInvalid} aria-describedby="extension-reason-error"
                              disabled={isSaving} oninput={handleReasonInput} onblur={handleBlur}></textarea>
                    <div class="field-foot">
                        <template lwc:if={reasonError}>
                            <span class="field-error" id="extension-reason-error">{reasonError}</span>
                        </template>
                        <span class="char-count">{reasonCount}</span>
                    </div>
                </div>

                <template lwc:if={modalError}>
                    <div class="form-error" role="alert">
                        <svg class="form-error-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                            <path d="M12 7v6M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                        </svg>
                        <span>{modalError}</span>
                    </div>
                </template>
            </div>

            <footer class="modal-footer">
                <button type="button" class="btn btn-outline" onmousedown={keepFocus} onclick={handleCancel} disabled={isSaving}>Cancel</button>
                <button type="button" class="btn btn-primary" onmousedown={keepFocus} onclick={handleSubmit} disabled={isSaving}>
                    <template lwc:if={isSaving}>
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <span>Sending…</span>
                    </template>
                    <template lwc:else>
                        <span>Submit request</span>
                    </template>
                </button>
            </footer>
        </section>
    </template>
</template>
