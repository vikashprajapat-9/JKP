<template>
    <div class="team-wrapper">

        <!-- ================= HEADER ================= -->
        <div class="team-header">
            <h1 class="team-title">My Team</h1>

            <!-- Add Executive once the partnership is Exclusive; until then a note in its place says so -->
            <template lwc:if={canAddExecutive}>
                <button class="add-exec-btn"
                        type="button"
                        onclick={handleAddExecutive}>
                    <svg class="btn-plus" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
                    </svg>
                    <span>Add Executive</span>
                </button>
            </template>
            <template lwc:elseif={showExclusiveNote}>
                <p class="exclusive-note" role="note">
                    <svg class="exclusive-note-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                        <path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                    </svg>
                    <span>{labels.exclusiveOnly}</span>
                </p>
            </template>
        </div>

        <p class="team-subtitle">
            Explore the profiles of our expert agents at John Keells Properties who are
            ready to assist you. Get to know their experience, areas of specialization,
            and contact information to make your real estate journey smoother. Our
            dedicated team is here to provide you with exceptional support and guidance
            throughout your property search.
        </p>

        <template lwc:if={error}>
            <div class="alert-banner error-banner" role="alert">
                <lightning-icon icon-name="utility:error" size="x-small" class="alert-icon"></lightning-icon>
                <span class="alert-text">{error}</span>
            </div>
        </template>

        <!-- ================= HERO CARD ================= -->
        <div class="hero-card">
            <div class="hero-left">
                <div class="hero-avatar" aria-hidden="true">{partnerInitials}</div>
                <div class="hero-info">
                    <h2 class="hero-name">{partnerName}</h2>
                    <p class="hero-role">Principal Partner •<br/>Channel Lead</p>
                </div>
            </div>

            <div class="hero-stats">
                <div class="stat-box">
                    <span class="stat-label">TOTAL LEADS</span>
                    <span class="stat-value">{leadsDisplay}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">BOOKINGS</span>
                    <span class="stat-value">{bookingsDisplay}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">EXECUTIVES</span>
                    <span class="stat-value">{executivesDisplay}</span>
                </div>
            </div>
        </div>

        <!-- ================= TEAM MEMBERS ================= -->
        <div class="section-header">
            <h2 class="section-title">Team Members</h2>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                    <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                </svg>
                <input
                    type="search"
                    class="search-input"
                    placeholder="Search by name.."
                    aria-label="Search team members by name"
                    value={searchKey}
                    oninput={handleSearch} />
            </div>
        </div>

        <template lwc:if={hasNoTeam}>
            <p class="empty-state">You don't have any executives in your team yet.</p>
        </template>

        <template lwc:if={hasNoResults}>
            <p class="empty-state">No team members match "{searchKey}".</p>
        </template>

        <div class="members-grid">
            <template for:each={pagedMembers} for:item="member">
                <div key={member.accountId} class="member-card">

                    <div class="member-header">
                        <div class={member.avatarClass} aria-hidden="true">{member.initials}</div>
                        <div class="member-info">
                            <h3 class="member-name">{member.fullName}</h3>
                            <p class="member-role">Executive</p>
                        </div>
                    </div>

                    <div class="member-stats">
                        <div class="mini-stat">
                            <span class="mini-label">
                                <lightning-icon icon-name="utility:user" size="xx-small"
                                                class="mini-icon"></lightning-icon>
                                Leads
                            </span>
                            <span class="mini-value">{member.leads}</span>
                        </div>
                        <div class="mini-stat">
                            <span class="mini-label">
                                <lightning-icon icon-name="utility:task" size="xx-small"
                                                class="mini-icon"></lightning-icon>
                                Bookings
                            </span>
                            <span class="mini-value">{member.bookings}</span>
                        </div>
                    </div>

                </div>
            </template>
        </div>

        <template lwc:if={showPagination}>
            <div class="pagination">
                <div class="entries-text">{entriesText}</div>
                <div class="pagination-controls">
                    <button class="page-arrow" type="button" onclick={handlePrev} disabled={isPrevDisabled}>
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M20 12H4M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Prev
                    </button>
                    <template for:each={paginationButtons} for:item="p">
                        <button
                            key={p.value}
                            type="button"
                            class={p.className}
                            data-value={p.value}
                            onclick={handlePageClick}>
                            {p.label}
                        </button>
                    </template>
                    <button class="page-arrow" type="button" onclick={handleNext} disabled={isNextDisabled}>
                        Next
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </template>

    </div>

    <template lwc:if={showAddMember}>
        <c-partner-web-portal-add-member onclose={handleCloseAddMember} onmemberadded={handleMemberAdded}></c-partner-web-portal-add-member>
    </template>
</template>
