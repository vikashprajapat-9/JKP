<template>
    <lightning-card>
        <template if:true={firstScreen}>
        <template if:true={costSheetRecords}>
            
            <div class="slds-m-bottom_medium slds-m-right_medium slds-m-left_medium">
                <!-- Custom Title -->
                <h1 class="center-title">Cost Sheets</h1>
            </div>
            <div class="scrollable-x slds-m-right_medium slds-m-left_medium">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered ">
                    <thead>
                        <tr>
                            <th>Select</th>
                            <th>Name</th>
                            <th>Cost Sheet Template</th>
                            <th>Payment Scheme</th>
                            <th>Created Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={costSheetRecords} for:item="costSheet">
                            <tr key={costSheet.Id}>
                                <td>
                                    <input 
                                        type="radio" 
                                        name="costSheetSelect" 
                                        value={costSheet.Id} data-costsheettempid={costSheet.Cost_Scheme_Linking__r.Cost_Sheet_Template__c}
                                        checked={costSheet.isSelected} 
                                        onchange={handleRadioChange} />
                                </td>
                                <td>{costSheet.Name}</td>
                                <td>{costSheet.Cost_Scheme_Linking__r.Cost_Sheet_Template__r.Name}</td>
                                <td>{costSheet.Cost_Scheme_Linking__r.Payment_Scheme__r.Name}</td>
                                <td>{costSheet.trimmedCreatedDate}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <template if:true={showButton}>
             <div class="slds-m-top_medium">
                <div style="text-align: right;">
                    <lightning-button label="Next" variant="brand" onclick={handleNext} class="slds-button_brand slds-m-right_medium" disabled={isDisabledNext}></lightning-button>
                </div>
            </div>
            </template>
        </template>
        </template>
        <template if:true={error}>
            <p class="slds-text-color_error">Error: {error.body.message}</p>
        </template>

        <template if:true={payment}>
        <template if:false={showHoldConfirmation}>
        <template if:true={paymentSchedules}>
            <div class="slds-m-bottom_medium slds-m-right_medium slds-m-left_medium">
                <!-- Custom Title -->
                <!-- <h1 class="center-title">Cost Sheets</h1> -->
            </div>
            <h3 class="slds-text-heading_medium slds-m-top_medium slds-m-bottom_small slds-m-right_medium slds-m-left_medium">Payment Schedules</h3>
            <div class="scrollable-x slds-m-right_medium slds-m-left_medium">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th>NO.</th>
                            <th>Installment </th>
                            <th>Installment(%)</th>
                            <th>AGR. VALUE</th>
                            <th>TAX Amount</th>
                            <th>OTH CHARGES</th>
                            <th>OTH Tax Amount</th>
                            <th>DUE DATE</th>
                            <th>PAY DATE</th>

                        
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={paymentSchedules} for:item="schedule">
                            <tr key={schedule.Id}>
                                <td>{schedule.serialNumber}</td>
                                <td>{schedule.Name}</td>
                                <td>{schedule.Installment__c}</td>
                                <td>{schedule.Agreement_Value__c}</td>
                                <td>{schedule.Tax_Amount__c}</td>
                                <td>{schedule.Other_Charges__c}</td>
                                <td>{schedule.Other_Tax_Amount__c}</td>
                                <td>{schedule.Due_Date__c}</td>
                                <td>{schedule.Pay_Date__c}</td>
                                
                            </tr>
                        </template>
                        <tr>
                        <td></td>
                        <td style="font-weight: bold;">TOTAL</td>
                        <td style="font-weight: bold;">{installment}</td>
                        <td style="font-weight: bold;">{roundedAgreementValue}</td>
                        <td style="font-weight: bold;">{roundedTaxAmount}</td>
                        <td style="font-weight: bold;">{otherCharges}</td>
                        <td style="font-weight: bold;">{otherTaxAmount}</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </template>

        <template if:true={costPricingAsstnList}>
            <!-- <div class="slds-m-top_xx-large">
                <h1 class="center-title">Cost Pricing Associations</h1>
            </div> -->
            <h3 class="slds-text-heading_medium slds-m-top_medium slds-m-bottom_small slds-m-right_medium slds-m-left_medium">Pricing Elements</h3>
            <div class="scrollable-x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-right_medium slds-m-left_medium">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Pricing Element Master</th>
                            <th>PE Type</th>
                            <th>Quantity</th>
                            <th>Rate</th>
                            <th>Amount</th>
                            <th>Discount Amount(On Rate)</th>
                            <th>Actual Amount without TAX</th>
                            <th>Tax Amount</th>
                            <th>Actual Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={costPricingAsstnList} for:item="schedule">
                            <tr key={schedule.Id}>
                                <td>{schedule.Name}</td>
                                <td>{schedule.Pricing_Element_Master__r.Name}</td>
                                <td>{schedule.PE_Type__c}</td>
                                <td>{schedule.Quantity__c}</td>
                                <td>{schedule.Rate__c}</td>
                                <td>{schedule.Amount__c}</td>
                                <td>{schedule.Discount_Amount__c}</td>
                                <td>{schedule.Total_Amount_Excluding_Tax__c}</td>
                                <td>{schedule.Tax_Amount__c}</td>
                                <td>{schedule.Actual_Amount__c}</td>
                            </tr>
                        </template>
                        <tr>
                        <td></td>
                        <td style="font-weight: bold;">TOTAL</td>
                        <td></td>
                        <!-- <td style="font-weight: bold;">{priceElementMasterQuantity}</td>
                        <td style="font-weight: bold;">{priceElementMasterRate}</td> -->
                        <td style="font-weight: bold;">{priceElementMasterinstallment}</td>
                        <td style="font-weight: bold;">{priceElementMasterDiscount}</td>
                        <td style="font-weight: bold;">{priceElementMasterActualDiscountWithoutTax}</td>
                        <td style="font-weight: bold;">{priceElementMasterTaxAmount}</td>
                        <td style="font-weight: bold;">{priceElementMasterActualDiscount}</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </template>
        <template if:true={approval}>
        <div class="action-buttons">
            <lightning-button label="Back" variant="brand" onclick={handleBack}> </lightning-button>
            <lightning-button label="Finalise"  variant="brand" onclick={handleFinalizeClick} disabled={isDisabledApproval}></lightning-button>
        </div>
    
        </template>
        </template>
        </template>

    </lightning-card>

        <template if:true={showHoldConfirmation}>
        <div class="hold-confirmation-container">
            <div class="hold-confirmation-header">
                <h2> Do you want to mark this Unit on Hold? </h2>
            </div>
            <div class="hold-confirmation-footer">
                <lightning-button label="Cancel" onclick={handleHoldCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button  label="Confirm"  variant="brand" onclick={handleHoldConfirm}></lightning-button>
            </div>
        </div>
    </template>

    <template if:true={showEscrowConfirmation}>
        <div class="escrow-confirmation-container">
            <div class="escrow-confirmation-header">
                <h2>Escrow Account</h2>
            </div>
            <div class="escrow-confirmation-content">
                <p class="escrow-question"> Do you want to create/use an Escrow Account?</p>
                <lightning-radio-group name="escrowOption" label="Escrow Account" options={escrowOptions} value={selectedEscrowOption} type="radio" onchange={handleEscrowOptionChange}> </lightning-radio-group>
            </div>
            <div class="escrow-confirmation-footer">
                <lightning-button label="Cancel" onclick={handleEscrowCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Confirm"  variant="brand" onclick={handleEscrowConfirm} disabled={isEscrowConfirmDisabled}> </lightning-button>
            </div>
        </div>
    </template>
</template>
