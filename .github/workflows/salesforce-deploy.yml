name: Reusable Salesforce Deployment

on:
  workflow_call:
    inputs:
      deployment_type:
        description: 'Deployment mode: full, delta, or validate'
        required: true
        type: string
      target_org_alias:
        description: 'Salesforce CLI target org alias'
        required: true
        type: string
      from_sha:
        description: 'Git SHA used as the delta baseline'
        required: false
        type: string
        default: ''
      to_sha:
        description: 'Git SHA used as the delta endpoint'
        required: false
        type: string
        default: ''
      send_notifications:
        description: 'Send deployment success/failure email notifications'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: ${{ inputs.deployment_type }} deployment
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.result.outputs.status }}
      deploy_id: ${{ steps.result.outputs.deploy_id }}
      components: ${{ steps.result.outputs.components }}
      errors: ${{ steps.result.outputs.errors }}
      skipped: ${{ steps.result.outputs.skipped }}
      failed: ${{ steps.result.outputs.failed }}
      stage: ${{ steps.result.outputs.stage }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Initial Stage
        run: echo "stage=Checkout" >> "$GITHUB_ENV"

      - name: Install Salesforce CLI
        run: |
          echo "stage=Install Salesforce CLI" >> "$GITHUB_ENV"
          npm install -g @salesforce/cli
          sf version

      - name: Verify Salesforce Project
        if: inputs.deployment_type == 'full' || inputs.deployment_type == 'validate'
        run: |
          echo "stage=Verify Salesforce Project" >> "$GITHUB_ENV"

          test -f sfdx-project.json || {
            echo "::error::sfdx-project.json was not found."
            exit 1
          }

          test -d force-app || {
            echo "::error::force-app directory was not found."
            exit 1
          }

          echo "Project:"
          pwd
          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Install Salesforce Git Delta
        if: inputs.deployment_type == 'delta'
        run: |
          echo "stage=Install SGD" >> "$GITHUB_ENV"

          SGD_VERSION="6.3.0"

          echo "Node:"
          node --version
          echo
          echo "Salesforce CLI:"
          sf version
          echo
          echo "Installing sfdx-git-delta@${SGD_VERSION}..."
          echo "y" | sf plugins install "sfdx-git-delta@${SGD_VERSION}"
          echo
          echo "========== Installed Plugins =========="
          sf plugins
          echo
          echo "========== SGD Verification =========="
          sf sgd --help

      - name: Verify Git Range
        if: inputs.deployment_type == 'delta'
        run: |
          echo "stage=Verify Git Range" >> "$GITHUB_ENV"

          echo "From SHA: ${{ inputs.from_sha }}"
          echo "To SHA:   ${{ inputs.to_sha }}"

          test -n "${{ inputs.from_sha }}" || {
            echo "::error::from_sha was not provided for delta deployment."
            exit 1
          }

          test -n "${{ inputs.to_sha }}" || {
            echo "::error::to_sha was not provided for delta deployment."
            exit 1
          }

          git cat-file -e "${{ inputs.from_sha }}^{commit}" || {
            echo "::error::Previous commit ${{ inputs.from_sha }} is not available."
            exit 1
          }

          git cat-file -e "${{ inputs.to_sha }}^{commit}" || {
            echo "::error::Target commit ${{ inputs.to_sha }} is not available."
            exit 1
          }

      - name: Generate Delta
        id: delta
        if: inputs.deployment_type == 'delta'
        run: |
          echo "stage=Generate Delta" >> "$GITHUB_ENV"

          rm -rf delta
          mkdir -p delta

          echo "========== Git Range =========="
          echo "From: ${{ inputs.from_sha }}"
          echo "To:   ${{ inputs.to_sha }}"

          echo
          echo "========== Changed Files =========="
          git diff --name-status \
            "${{ inputs.from_sha }}" \
            "${{ inputs.to_sha }}" || true

          echo
          echo "========== Generating SGD Delta =========="

          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --ignore-file .sgdignore \
            --output-dir delta
          echo
          echo "========== Generated Delta =========="
          find delta -type f | sort

      - name: Inspect Delta
        id: inspect
        if: inputs.deployment_type == 'delta'
        run: |
          echo "stage=Inspect Delta" >> "$GITHUB_ENV"

          PACKAGE_FILE="delta/package/package.xml"

          if [[ ! -f "${PACKAGE_FILE}" ]]; then
            echo "::error::Delta package.xml was not generated."
            exit 1
          fi

          echo "========== Delta package.xml =========="
          cat "${PACKAGE_FILE}"

          if grep -q "<types>" "${PACKAGE_FILE}"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

          echo
          echo "========== Delta Source =========="
          find delta/force-app -type f 2>/dev/null | sort || true

          echo
          echo "========== Destructive Changes =========="
          find delta -maxdepth 2 -type f -name '*destructiveChanges*.xml' -print -exec cat {} \; || true

      - name: Build Delta Summary
        if: inputs.deployment_type == 'delta' && steps.inspect.outputs.deploy == 'true'
        run: |
          python3 << 'PY'
          import xml.etree.ElementTree as ET

          package_file = "delta/package/package.xml"
          output_file = "deployment-summary.txt"

          ns = {"m": "http://soap.sforce.com/2006/04/metadata"}
          tree = ET.parse(package_file)
          root = tree.getroot()

          lines = []

          for metadata_type in root.findall("m:types", ns):
              name = metadata_type.findtext("m:name", default="Unknown", namespaces=ns)
              lines.append(name)
              lines.append("-" * len(name))

              for member in metadata_type.findall("m:members", ns):
                  lines.append(member.text or "")

              lines.append("")

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

          echo "========== Deployment Summary =========="
          cat deployment-summary.txt

      - name: Authenticate to Salesforce
        id: auth
        if: inputs.deployment_type == 'full' || inputs.deployment_type == 'validate' || (inputs.deployment_type == 'delta' && steps.inspect.outputs.deploy == 'true')
        run: |
          echo "stage=Authenticate" >> "$GITHUB_ENV"

          printf '%s' "${{ secrets.SF_AUTH_URL }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias "${{ inputs.target_org_alias }}"

          rm -f auth.txt

      - name: Verify Salesforce Authentication
        id: auth_check
        if: inputs.deployment_type == 'full' || inputs.deployment_type == 'validate' || (inputs.deployment_type == 'delta' && steps.inspect.outputs.deploy == 'true')
        run: |
          echo "stage=Verify Authentication" >> "$GITHUB_ENV"

          sf org display \
            --target-org "${{ inputs.target_org_alias }}" \
            --json | tee auth-result.json
            
      - name: Verify Ignored Files
        run: |
          echo "========== .forceignore =========="
          cat .forceignore
      
          echo
          echo "========== Ignored Permission Set =========="
          sf project list ignored \
            --source-dir force-app/main/default/permissionsets/sfdcInternalInt__sfdc_slack.permissionset-meta.xml
            
      - name: Start Full Deployment
        if: inputs.deployment_type == 'full'
        run: |
          echo "stage=Salesforce Full Deployment" >> "$GITHUB_ENV"

          : > deploy-result.json
          : > deploy-error.log

          set +e

          sf project deploy start \
            --source-dir force-app \
            --target-org "${{ inputs.target_org_alias }}" \
            --ignore-conflicts \
            --wait 120 \
            --json \
            > deploy-result.json \
            2> deploy-error.log

          SF_EXIT_CODE=$?

          set -e

          echo "Salesforce CLI exit code: ${SF_EXIT_CODE}"

          echo
          echo "========== Salesforce CLI STDOUT =========="
          cat deploy-result.json || true

          echo
          echo "========== Salesforce CLI STDERR =========="
          cat deploy-error.log || true

          if ! jq empty deploy-result.json >/dev/null 2>&1; then
            echo "::error::Salesforce CLI did not return valid JSON."
            exit "${SF_EXIT_CODE:-1}"
          fi

          STATUS=$(jq -r '.result.status // "Unknown"' deploy-result.json)
          DEPLOY_ID=$(jq -r '.result.id // "N/A"' deploy-result.json)

          echo "Deployment ID: ${DEPLOY_ID}"
          echo "Deployment Status: ${STATUS}"

          if [[ "${STATUS}" != "Succeeded" ]]; then
            echo "::error::Salesforce deployment did not succeed. Status: ${STATUS}"
            exit "${SF_EXIT_CODE:-1}"
          fi

          if [[ "${SF_EXIT_CODE}" -ne 0 ]]; then
            echo "::error::Salesforce CLI returned exit code ${SF_EXIT_CODE}."
            exit "${SF_EXIT_CODE}"
          fi

      - name: Deploy Delta
        if: inputs.deployment_type == 'delta' && steps.inspect.outputs.deploy == 'true'
        run: |
          echo "stage=Salesforce Delta Deployment" >> "$GITHUB_ENV"

          : > deploy-result.json
          : > deploy-error.log

          set +e

          sf project deploy start \
            --source-dir delta/force-app \
            --target-org "${{ inputs.target_org_alias }}" \
            --ignore-conflicts \
            --wait 120 \
            --json \
            > deploy-result.json \
            2> deploy-error.log

          SF_EXIT_CODE=$?

          set -e

          echo "Salesforce CLI exit code: ${SF_EXIT_CODE}"

          echo
          echo "========== Salesforce CLI STDOUT =========="
          cat deploy-result.json || true

          echo
          echo "========== Salesforce CLI STDERR =========="
          cat deploy-error.log || true

          if ! jq empty deploy-result.json >/dev/null 2>&1; then
            echo "::error::Salesforce CLI did not return valid JSON."
            exit "${SF_EXIT_CODE:-1}"
          fi

          STATUS=$(jq -r '.result.status // "Unknown"' deploy-result.json)
          DEPLOY_ID=$(jq -r '.result.id // "N/A"' deploy-result.json)

          echo "Deployment ID: ${DEPLOY_ID}"
          echo "Deployment Status: ${STATUS}"

          if [[ "${STATUS}" != "Succeeded" ]]; then
            echo "::error::Salesforce deployment did not succeed. Status: ${STATUS}"
            exit "${SF_EXIT_CODE:-1}"
          fi

          if [[ "${SF_EXIT_CODE}" -ne 0 ]]; then
            echo "::error::Salesforce CLI returned exit code ${SF_EXIT_CODE}."
            exit "${SF_EXIT_CODE}"
          fi

      - name: Validate Deployment
        if: inputs.deployment_type == 'validate'
        run: |
          echo "stage=Salesforce Validation" >> "$GITHUB_ENV"

          sf project deploy validate \
            --target-org "${{ inputs.target_org_alias }}" \
            --source-dir force-app \
            --wait 30

      - name: Collect Deployment Result
        id: result
        if: always() && inputs.deployment_type != 'validate'
        run: |
          if [[ "${{ inputs.deployment_type }}" == "delta" && "${{ steps.inspect.outputs.deploy }}" != "true" ]]; then
            STATUS="Skipped"
            DEPLOY_ID="N/A"
            COMPONENTS="0"
            ERRORS="0"
            SKIPPED=true
            FAILED=false
          else
            STATUS=$(jq -r '.result.status // "Unknown"' deploy-result.json 2>/dev/null || echo "Unknown")
            DEPLOY_ID=$(jq -r '.result.id // "N/A"' deploy-result.json 2>/dev/null || echo "N/A")
            COMPONENTS=$(jq -r '.result.numberComponentsDeployed // 0' deploy-result.json 2>/dev/null || echo "0")
            ERRORS=$(jq -r '.result.numberComponentErrors // 0' deploy-result.json 2>/dev/null || echo "0")
            SKIPPED=false

            if [[ "${STATUS}" == "Succeeded" ]]; then
              FAILED=false
            else
              FAILED=true
            fi
          fi

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "errors=${ERRORS}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "stage=${stage:-Unknown}" >> "$GITHUB_OUTPUT"

          {
            echo "## ${{ inputs.deployment_type }} Deployment Result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${STATUS} |"
            echo "| Deployment ID | ${DEPLOY_ID} |"
            echo "| Components Deployed | ${COMPONENTS} |"
            echo "| Component Errors | ${ERRORS} |"
            echo "| Skipped | ${SKIPPED} |"
            echo "| Last Stage | ${stage:-Unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.deployment_type }}-deployment-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            delta/**
            deploy-result.json
            deploy-error.log
            deployment-summary.txt
            auth-result.json
            sfdx-project.json

  notify:
    name: Deployment Notification
    if: always() && inputs.send_notifications && inputs.deployment_type != 'validate'
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Report No Metadata Changes
        if: needs.deploy.outputs.skipped == 'true'
        run: |
          echo "No deployable Salesforce metadata was found in this commit range."
          echo "Workflow completed without a Salesforce deployment."

      - name: Send Success Email
        if: needs.deploy.outputs.skipped != 'true' && needs.deploy.outputs.status == 'Succeeded'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "JKP ${{ inputs.deployment_type }} Sandbox Deployment Successful"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          html_body: |
            <h2 style="color:green;">Salesforce Deployment Successful</h2>
            <p><b>Type:</b> ${{ inputs.deployment_type }}</p>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Deployment ID:</b> ${{ needs.deploy.outputs.deploy_id }}</p>
            <p><b>Components:</b> ${{ needs.deploy.outputs.components }}</p>
            <p><b>Component Errors:</b> ${{ needs.deploy.outputs.errors }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Action Run</a></p>

      - name: Send Failure Email
        if: needs.deploy.outputs.failed == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "JKP ${{ inputs.deployment_type }} Sandbox Deployment Failed"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          html_body: |
            <h2 style="color:red;">Salesforce Deployment Failed</h2>
            <p><b>Type:</b> ${{ inputs.deployment_type }}</p>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Last Stage:</b> ${{ needs.deploy.outputs.stage }}</p>
            <p><b>Status:</b> ${{ needs.deploy.outputs.status }}</p>
            <p><b>Deployment ID:</b> ${{ needs.deploy.outputs.deploy_id }}</p>
            <p><b>Components:</b> ${{ needs.deploy.outputs.components }}</p>
            <p><b>Component Errors:</b> ${{ needs.deploy.outputs.errors }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Action Run</a></p>
