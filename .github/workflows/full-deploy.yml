name: Full Deploy - Main Sandbox

on:
  workflow_dispatch:

concurrency:
  group: full-deploy-main-sandbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Full Deploy to Main Sandbox
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.result.outputs.status }}
      deploy_id: ${{ steps.result.outputs.deploy_id }}
      components: ${{ steps.result.outputs.components }}
      errors: ${{ steps.result.outputs.errors }}
      failed: ${{ steps.result.outputs.failed }}
      stage: ${{ steps.result.outputs.stage }}

    steps:
      - name: Set Stage - Checkout
        run: echo "stage=Checkout" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          echo "stage=Install Salesforce CLI" >> "$GITHUB_ENV"
          npm install -g @salesforce/cli
          sf version

      - name: Verify Salesforce Project
        run: |
          echo "stage=Verify Salesforce Project" >> "$GITHUB_ENV"

          test -f sfdx-project.json || {
            echo "::error::sfdx-project.json was not found."
            exit 1
          }

          test -d force-app || {
            echo "::error::force-app directory was not found."
            exit 1
          }

          echo "Project:"
          pwd
          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

      - name: Authenticate to Salesforce
        run: |
          echo "stage=Authenticate" >> "$GITHUB_ENV"

          printf '%s' "${{ secrets.SF_AUTH_URL }}" > auth.txt

          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias dev

          rm -f auth.txt

      - name: Verify Salesforce Authentication
        run: |
          echo "stage=Verify Authentication" >> "$GITHUB_ENV"

          sf org display \
            --target-org dev \
            --json | tee auth-result.json

      - name: Start Full Deployment
        id: deploy
        run: |
          echo "stage=Salesforce Deployment" >> "$GITHUB_ENV"

          : > deploy-result.json
          : > deploy-error.log

          set +e

          sf project deploy start \
            --source-dir force-app \
            --target-org dev \
            --ignore-conflicts \
            --wait 120 \
            --json \
            > deploy-result.json \
            2> deploy-error.log

          SF_EXIT_CODE=$?

          set -e

          echo "Salesforce CLI exit code: ${SF_EXIT_CODE}"

          echo
          echo "========== Salesforce CLI STDOUT =========="
          cat deploy-result.json || true

          echo
          echo "========== Salesforce CLI STDERR =========="
          cat deploy-error.log || true

          if ! jq empty deploy-result.json >/dev/null 2>&1; then
            echo "::error::Salesforce CLI did not return valid JSON."
            exit "${SF_EXIT_CODE:-1}"
          fi

          STATUS=$(jq -r '.result.status // "Unknown"' deploy-result.json)
          DEPLOY_ID=$(jq -r '.result.id // "N/A"' deploy-result.json)

          echo "Deployment ID: ${DEPLOY_ID}"
          echo "Deployment Status: ${STATUS}"

          if [[ "${STATUS}" != "Succeeded" ]]; then
            echo "::error::Salesforce deployment did not succeed. Status: ${STATUS}"
            exit "${SF_EXIT_CODE:-1}"
          fi

          if [[ "${SF_EXIT_CODE}" -ne 0 ]]; then
            echo "::error::Salesforce CLI returned exit code ${SF_EXIT_CODE}."
            exit "${SF_EXIT_CODE}"
          fi

      - name: Collect Deployment Result
        id: result
        if: always()
        run: |
          STATUS=$(jq -r '.result.status // "Unknown"' deploy-result.json 2>/dev/null || echo "Unknown")
          DEPLOY_ID=$(jq -r '.result.id // "N/A"' deploy-result.json 2>/dev/null || echo "N/A")
          COMPONENTS=$(jq -r '.result.numberComponentsDeployed // 0' deploy-result.json 2>/dev/null || echo "0")
          ERRORS=$(jq -r '.result.numberComponentErrors // 0' deploy-result.json 2>/dev/null || echo "0")

          if [[ "${STATUS}" == "Succeeded" ]]; then
            FAILED=false
          else
            FAILED=true
          fi

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          echo "components=${COMPONENTS}" >> "$GITHUB_OUTPUT"
          echo "errors=${ERRORS}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "stage=${stage:-Unknown}" >> "$GITHUB_OUTPUT"

          {
            echo "## Full Deployment Result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | ${STATUS} |"
            echo "| Deployment ID | ${DEPLOY_ID} |"
            echo "| Components Deployed | ${COMPONENTS} |"
            echo "| Component Errors | ${ERRORS} |"
            echo "| Failed | ${FAILED} |"
            echo "| Last Stage | ${stage:-Unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-deployment-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            deploy-result.json
            deploy-error.log
            auth-result.json
            sfdx-project.json

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send Success Email
        if: needs.deploy.outputs.failed == 'false'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "JKP Full Sandbox Deployment Successful"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          html_body: |
            <h2 style="color:green;">Full Deployment Successful</h2>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Deployment ID:</b> ${{ needs.deploy.outputs.deploy_id }}</p>
            <p><b>Components:</b> ${{ needs.deploy.outputs.components }}</p>
            <p><b>Component Errors:</b> ${{ needs.deploy.outputs.errors }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Action Run</a></p>

      - name: Send Failure Email
        if: needs.deploy.outputs.failed == 'true'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "JKP Full Sandbox Deployment Failed"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions
          html_body: |
            <h2 style="color:red;">Full Deployment Failed</h2>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Commit:</b> ${{ github.sha }}</p>
            <p><b>Last Stage:</b> ${{ needs.deploy.outputs.stage }}</p>
            <p><b>Status:</b> ${{ needs.deploy.outputs.status }}</p>
            <p><b>Deployment ID:</b> ${{ needs.deploy.outputs.deploy_id }}</p>
            <p><b>Components:</b> ${{ needs.deploy.outputs.components }}</p>
            <p><b>Component Errors:</b> ${{ needs.deploy.outputs.errors }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Action Run</a></p>